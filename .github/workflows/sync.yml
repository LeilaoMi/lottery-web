name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 免费版 Cron 配额已满，改用 Actions 定时触发 Worker 落库（UTC 时间，北京时间 +8）
    - cron: "40 13 * * 2,4,0"   # 双色球：周二/四/日 21:40
    - cron: "20 13 * * 1,3,6"   # 大乐透：周一/三/六 21:20
    - cron: "30 13 * * *"       # 每日小彩种（3D/排列3/5/快乐8 每日开奖）
  workflow_dispatch:

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 构建前端产物（worker/src/ui.js 是 gitignore 的构建输出）
        # review.test.mjs 会 import worker/src/index.js，而 index.js 里 `import { HTML } from "./ui.js"`
        # —— 干净检出时没有这个文件，测试直接 ERR_MODULE_NOT_FOUND（本地因为有产物是绿的）
        run: node scripts/build-ui.mjs
      - name: 运行单元测试（零依赖：预测引擎 / 冷门度 / 复盘闭环端到端 / 统计内核）
        # 统计内核（12 项）同时被 worker 的 coldness 常量与复盘基线依赖，放在 push 时跑：
        # 只在每月 randomness 作业里跑的话，写坏内核要红一个月才发现
        run: node --test worker/test/unit.test.mjs worker/test/predict.test.mjs worker/test/coldness.test.mjs worker/test/review.test.mjs scripts/randomness/stats.test.mjs

  smoke:
    name: 线上冒烟
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 部署冒烟（push / 定时同步后验证线上端点仍健康）
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_URL:-}" ]; then
            echo "::warning::未配置 secrets.WORKER_URL，跳过冒烟"
            exit 0
          fi
          check() { # 名称 路径 node断言（可空）
            local name="$1" path="$2" expect="$3"
            code=$(curl -sS -m 30 -o /tmp/smoke.json -w "%{http_code}" "$WORKER_URL$path")
            if [ "$code" != "200" ]; then
              echo "::error::冒烟失败 $name：HTTP $code"
              exit 1
            fi
            if [ -n "$expect" ] && ! node -e "const j=require('/tmp/smoke.json'); if(!($expect)) process.exit(1)"; then
              echo "::error::冒烟失败 $name：断言不通过"
              cat /tmp/smoke.json
              exit 1
            fi
            echo "ok: $name"
          }
          check health        /health            "j.status === 'ok'"
          check meta          /api/meta          "Array.isArray(j.lotteries) && j.lotteries.length === 8"
          check ssq-latest    /api/ssq/latest    "j.code && (j.red || j.front || j.main)"
          check dlt-predict   /api/dlt/predict   "j.kind === 'dlt' && Array.isArray(j.picks) && j.picks.length > 0"
          check review        /api/review        "Array.isArray(j.rows) && j.meta && typeof j.meta.total === 'number'"
          echo "线上冒烟 5 端点全部通过（复盘闭环健康门禁见 review job，此处只验响应形状）"

  review:
    name: 复盘闭环
    needs: sync
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 显式触发快照+对账并校验闭环仍在跑
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_URL:-}" ] || [ -z "${API_TOKEN:-}" ]; then
            echo "::error::未配置 secrets.WORKER_URL 或 secrets.API_TOKEN"
            exit 1
          fi
          # 显式 HTTP 调用，不再只依赖 adminSync 内部的 waitUntil 自 fetch：
          # 那条通路在免费层会被静默丢弃，v0.11~v0.12 期间闭环死亡五天而 CI 全绿就是它造成的
          code=$(curl -sS -m 120 -o /tmp/reviewjob.json -w "%{http_code}" -X POST \
            "$WORKER_URL/api/admin/review-job" -H "Authorization: Bearer $API_TOKEN")
          echo "HTTP $code"; cat /tmp/reviewjob.json
          [ "$code" = "200" ] || { echo "::error::review-job 返回 $code"; exit 1; }
          node -e '
            const j = require("/tmp/reviewjob.json");
            if (!j.ok) { console.error("::error::review-job 未返回 ok:true — " + JSON.stringify(j)); process.exit(1); }
            const rs = j.results || {};
            const dead = Object.entries(rs).filter(([, v]) => !v || v.error || v.skip || !(v.snapshot));
            if (dead.length) { console.error("::error::以下彩种未生成快照：" + JSON.stringify(dead)); process.exit(1); }
            console.log("快照已写：" + Object.entries(rs).map(([k, v]) => k + "@" + v.snapshot + "(对账" + v.reconciled + ")").join(" "));
          '
          curl -sS -m 30 -o /tmp/meta.json "$WORKER_URL/api/meta"
          node -e '
            const j = require("/tmp/meta.json");
            const pl = j.predlog;
            if (!Array.isArray(pl) || !pl.length) { console.error("::error::/api/meta 无 predlog —— 闭环从未写入或被旧版本 Worker 屏蔽"); process.exit(1); }
            const daily = ["fc3d","pl3","pl5","kl8"];
            const bad = [];
            for (const k of daily) {
              const e = pl.find(x => x.kind === k);
              if (!e) { bad.push(k + " 无快照记录"); continue; }
              if (e.days === null || e.days > 2) bad.push(k + " 最新快照距今 " + e.days + " 天（每日开奖彩种应 ≤2）");
              if (!e.latestChecked) bad.push(k + " 从未对账（latestChecked=null）");
            }
            if (bad.length) { console.error("::error::复盘闭环停摆：" + bad.join(" ; ")); process.exit(1); }
            console.log("闭环健康：" + pl.map(e => e.kind + " 快照" + e.latestSnapshot + " 对账至" + e.latestChecked + " 待对账" + e.unreconciled).join(" | "));
          '

  sync:
    name: 落库同步
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Worker 落库并校验
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_URL:-}" ] || [ -z "${API_TOKEN:-}" ]; then
            echo "::error::未配置 secrets.WORKER_URL 或 secrets.API_TOKEN，跳过同步"
            exit 1
          fi
          code=$(curl -sS -o /tmp/sync.json -w "%{http_code}" -X POST \
            "$WORKER_URL/api/admin/sync" -H "Authorization: Bearer $API_TOKEN")
          echo "HTTP $code"
          cat /tmp/sync.json
          if [ "$code" != "200" ]; then
            echo "::error::同步接口返回 $code"
            exit 1
          fi
          node -e '
            const j = require("/tmp/sync.json");
            const rs = j.results || {};
            const bad = Object.entries(rs).filter(([, v]) => v && (v.error || !v.fetched));
            if (bad.length) {
              console.error("::error::以下彩种同步异常：" + JSON.stringify(bad));
              process.exit(1);
            }
            if (!j.db) { console.error("::error::Worker 未绑定 D1，落库实际未生效"); process.exit(1); }
            console.log("落库完成：" + Object.entries(rs).map(([k, v]) => k + "=" + v.inserted).join(" "));
          '
