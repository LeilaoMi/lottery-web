name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 免费版 Cron 配额已满，改用 Actions 定时触发 Worker 落库（UTC 时间，北京时间 +8）
    - cron: "40 13 * * 2,4,0"   # 双色球：周二/四/日 21:40
    - cron: "20 13 * * 1,3,6"   # 大乐透：周一/三/六 21:20
    - cron: "30 13 * * *"       # 每日小彩种（3D/排列3/5/快乐8 每日开奖）
  workflow_dispatch:

concurrency:
  # 与 backup.yml 共用一个组，不让两条流水线同时碰生产库。
  # 起因是实测：手动 dispatch 的备份与 push 的冒烟撞上时，`/api/review` 直接 500
  # —— wrangler 导出前那句警告不是客套，「during which your D1 database will be unavailable to serve queries」。
  # cancel-in-progress 故意留 false：落库/对账跑到一半被掐掉，比在后面排队等它跑完更糟。
  group: lottery-prod
  cancel-in-progress: false

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 构建前端产物（worker/src/ui.js 是 gitignore 的构建输出）
        # review.test.mjs 会 import worker/src/index.js，而 index.js 里 `import { HTML } from "./ui.js"`
        # —— 干净检出时没有这个文件，测试直接 ERR_MODULE_NOT_FOUND（本地因为有产物是绿的）
        run: node scripts/build-ui.mjs
      - name: 运行单元测试（零依赖：预测引擎 / 冷门度 / 复盘闭环端到端 / 批量验奖 + 前后端契约 / 上游超时 / 推送 / 统计内核）
        # 统计内核（12 项）同时被 worker 的 coldness 常量与复盘基线依赖，放在 push 时跑：
        # 只在每月 randomness 作业里跑的话，写坏内核要红一个月才发现
        # ui-render.test.mjs 读 frontend/index.html 渲染真实后端响应 → 前后端字段改名会在 push 时立刻红
        # notify.test.mjs 用本地 http server 真发一次 → 「以为在推、其实从没发出去」不会漏过
        # net.test.mjs 用不回包的本地 server 验超时真的会掐断 → 上游挂死把请求拖到 30s 会有人管
        run: node --test worker/test/unit.test.mjs worker/test/predict.test.mjs worker/test/coldness.test.mjs worker/test/review.test.mjs worker/test/verify-batch.test.mjs worker/test/ui-render.test.mjs worker/test/net.test.mjs scripts/randomness/stats.test.mjs scripts/notify.test.mjs

  smoke:
    name: 线上冒烟
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 部署冒烟（push / 定时同步后验证线上端点仍健康）
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_URL:-}" ]; then
            echo "::warning::未配置 secrets.WORKER_URL，跳过冒烟"
            exit 0
          fi
          check() { # 名称 路径 node断言（可空）
            local name="$1" path="$2" expect="$3"
            code=$(curl -sS -m 30 -o /tmp/smoke.json -w "%{http_code}" "$WORKER_URL$path")
            if [ "$code" != "200" ]; then
              echo "::error::冒烟失败 $name：HTTP $code"
              exit 1
            fi
            if [ -n "$expect" ] && ! node -e "const j=require('/tmp/smoke.json'); if(!($expect)) process.exit(1)"; then
              echo "::error::冒烟失败 $name：断言不通过"
              cat /tmp/smoke.json
              exit 1
            fi
            echo "ok: $name"
          }
          check health        /health            "j.status === 'ok'"
          check meta          /api/meta          "Array.isArray(j.lotteries) && j.lotteries.length === 8"
          check ssq-latest    /api/ssq/latest    "j.code && (j.red || j.front || j.main)"
          check dlt-predict   /api/dlt/predict   "j.kind === 'dlt' && Array.isArray(j.picks) && j.picks.length > 0"
          check review        /api/review        "Array.isArray(j.rows) && j.meta && typeof j.meta.total === 'number'"
          echo "线上冒烟 5 端点全部通过（复盘闭环健康门禁见 review job，此处只验响应形状）"

  review:
    name: 复盘闭环
    needs: sync
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 显式触发快照+对账并校验闭环仍在跑
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_URL:-}" ] || [ -z "${API_TOKEN:-}" ]; then
            echo "::error::未配置 secrets.WORKER_URL 或 secrets.API_TOKEN"
            exit 1
          fi
          # 显式 HTTP 调用，不再只依赖 adminSync 内部的 waitUntil 自 fetch：
          # 那条通路在免费层会被静默丢弃，v0.11~v0.12 期间闭环死亡五天而 CI 全绿就是它造成的
          code=$(curl -sS -m 120 -o /tmp/reviewjob.json -w "%{http_code}" -X POST \
            "$WORKER_URL/api/admin/review-job" -H "Authorization: Bearer $API_TOKEN")
          echo "HTTP $code"; cat /tmp/reviewjob.json
          [ "$code" = "200" ] || { echo "::error::review-job 返回 $code"; exit 1; }
          node -e '
            const j = require("/tmp/reviewjob.json");
            if (!j.ok) { console.error("::error::review-job 未返回 ok:true — " + JSON.stringify(j)); process.exit(1); }
            const rs = j.results || {};
            const dead = Object.entries(rs).filter(([, v]) => !v || v.error || v.skip || !(v.snapshot));
            if (dead.length) { console.error("::error::以下彩种未生成快照：" + JSON.stringify(dead)); process.exit(1); }
            console.log("快照已写：" + Object.entries(rs).map(([k, v]) => k + "@" + v.snapshot + "(对账" + v.reconciled + ")").join(" "));
          '
          curl -sS -m 30 -o /tmp/meta.json "$WORKER_URL/api/meta"
          for k in fc3d pl3 pl5 kl8; do curl -sS -m 30 -o /tmp/rev-$k.json "$WORKER_URL/api/review?kind=$k&limit=50"; done
          node -e '
            const m = require("/tmp/meta.json");
            const pl = m.predlog;
            if (!Array.isArray(pl) || !pl.length) { console.error("::error::/api/meta 无 predlog —— 闭环从未写入或被旧版本 Worker 屏蔽"); process.exit(1); }
            const latest = {}; (m.stale || []).forEach(s => latest[s.kind] = s.latest);
            const daily = ["fc3d","pl3","pl5","kl8"];
            const bad = [], info = [];
            for (const k of daily) {
              const e = pl.find(x => x.kind === k);
              if (!e) { bad.push(k + " 无快照记录"); continue; }
              if (e.days === null || e.days > 2) bad.push(k + " 最新快照距今 " + e.days + " 天（每日开奖彩种应 ≤2）");
              const rows = (require("/tmp/rev-" + k + ".json").rows) || [];
              if (!rows.length) { bad.push(k + " /api/review 查不到任何快照行"); continue; }
              const L = latest[k];
              // 真正的停摆定义：某期的开奖已经发生，但它仍没被对账。
              // 「最新快照是还没开的那一期」不是病，是常态——曾经用 latestChecked 非空当健康判据，
              // 结果一次性清理完遗留坏快照的当天必然误报（那 4 个彩种唯一的可对该行正是被清掉的坏数据）。
              const overdue = L ? rows.filter(r => !r.checked && String(r.code) <= String(L)) : [];
              if (overdue.length) bad.push(k + " 逾期未对账 " + overdue.length + " 条（最新开奖 " + L + "，卡住期号 " + overdue.slice(0, 3).map(r => r.code).join(",") + "）");
              info.push(k + " 快照至 " + e.latestSnapshot + "｜已对账至 " + (e.latestChecked || "无") + "｜未来期待对账 " + rows.filter(r => !r.checked && L && String(r.code) > String(L)).length);
            }
            if (!pl.some(e => e.latestChecked)) bad.push("全库没有任何一条已对账记录 —— UPDATE 通路是死的");
            if (bad.length) { console.error("::error::复盘闭环异常：" + bad.join(" ; ")); process.exit(1); }
            console.log("闭环健康：" + info.join(" | "));
            console.log("全库对账进度：" + pl.map(e => e.kind + "=" + (e.latestChecked || "无")).join(" "));
          '

  sync:
    name: 落库同步
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Worker 落库并校验
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_URL:-}" ] || [ -z "${API_TOKEN:-}" ]; then
            echo "::error::未配置 secrets.WORKER_URL 或 secrets.API_TOKEN，跳过同步"
            exit 1
          fi
          code=$(curl -sS -o /tmp/sync.json -w "%{http_code}" -X POST \
            "$WORKER_URL/api/admin/sync" -H "Authorization: Bearer $API_TOKEN")
          echo "HTTP $code"
          cat /tmp/sync.json
          if [ "$code" != "200" ]; then
            echo "::error::同步接口返回 $code"
            exit 1
          fi
          node -e '
            const j = require("/tmp/sync.json");
            const rs = j.results || {};
            const bad = Object.entries(rs).filter(([, v]) => v && (v.error || !v.fetched));
            if (bad.length) {
              console.error("::error::以下彩种同步异常：" + JSON.stringify(bad));
              process.exit(1);
            }
            if (!j.db) { console.error("::error::Worker 未绑定 D1，落库实际未生效"); process.exit(1); }
            console.log("落库完成：" + Object.entries(rs).map(([k, v]) => k + "=" + v.inserted).join(" "));
          '

  notify:
    name: 开奖推送（默认关闭）
    # needs 里的 job 失败也要推 —— 告警通路的价值恰恰在出问题的时候，所以用 !cancelled() 而不是默认的成功才跑
    needs: [sync, review]
    # 只在定时同步 / 手动 dispatch 后推送：sync.yml 同样在代码 push 时触发，若不排除会「每提交一次就往群里发一条播报」。
    # 想连代码 push 一起推，去掉后面两个事件名条件即可。
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
      NOTIFY_FORMAT: ${{ vars.NOTIFY_FORMAT }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - name: 取今日开奖并推送（未配置 webhook 时如实跳过）
        run: |
          set -euo pipefail
          if [ -z "${NOTIFY_WEBHOOK_URL:-}" ]; then
            echo "未配置 secrets.NOTIFY_WEBHOOK_URL —— 推送保持关闭（默认状态）。见 docs/NOTIFY.md"
            exit 0
          fi
          # 北京时间：落库窗口是 21:20~21:40 CST，与 UTC 同一自然日，但手动 dispatch 时可能跨天
          export NOTIFY_DATE="$(TZ=Asia/Shanghai date +%F)"
          RESULTS="$(node -e 'const n=JSON.parse(process.env.NEEDS_JSON||"{}");process.stdout.write(JSON.stringify(Object.fromEntries(Object.entries(n).map(([k,v])=>[k,(v&&v.result)||"unknown"]))))')"
          echo "job 结果：$RESULTS"
          node scripts/notify.mjs "$RESULTS"
