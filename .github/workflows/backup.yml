name: d1-backup

# D1 每日备份（可选，默认不跑）
# 没配 secrets 时整个 job 直接跳过并给出提示 —— fork 本项目的人不会因为多了一个红叉而困扰。
#
# 需要配置（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   拥有 D1 读权限（建议用最小权限 Token，见 docs/PUBLISH.md）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账号 ID
#   D1_DATABASE            wrangler.toml 里的 D1 database 名（不是 UUID 也行）
# 可选：
#   R2_BUCKET              设了就推到 R2（私有、可长期保留），此时不再上传 Actions 产物
#   BACKUP_INCLUDE_FAVS    设成 0 则备份里剔除个人收藏表 favs（公开仓库建议关掉）
#
# 为什么默认落产物要带警告：GitHub 在**公开仓库**里下载的 Actions 产物不需要登录，
# 谁能看仓库谁就能把你的整库 SQL 拖走。开奖数据本身是公开的，fav（收藏）不是。
on:
  schedule:
    - cron: "0 16 * * *"    # UTC 16:00 = 北京 00:00，排在当日落库之后
  workflow_dispatch:
    inputs:
      include_favs:
        description: "备份是否包含个人收藏表 favs（公开仓库建议填 0）"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    name: 导出 D1 并验证可还原
    runs-on: ubuntu-latest
    env:
      WRANGLER_VERSION: "4"          # 只锁大版本：wrangler 更新频繁，锁死小版本容易因上游废弃而长期红
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE: ${{ secrets.D1_DATABASE }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      INCLUDE_FAVS: ${{ github.event.inputs.include_favs || vars.BACKUP_INCLUDE_FAVS || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 未配置凭证则跳过（fork 友好）
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${D1_DATABASE:-}" ]; then
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE，跳过备份"
            echo "### 备份未运行" >> "$GITHUB_STEP_SUMMARY"
            echo "需要配置 3 个 secrets 才会启用，见 \`.github/workflows/backup.yml\` 顶部说明与 docs/PUBLISH.md" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "BACKUP_ENABLED=1" >> "$GITHUB_ENV"

      - name: 导出远端 D1 为 SQL
        if: env.BACKUP_ENABLED == '1'
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d-%H%M)"
          OUT="backup-$STAMP.sql"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ARGS=(d1 export "$D1_DATABASE" --remote --output "$OUT")
          if [ "$INCLUDE_FAVS" = "0" ]; then
            # --table 是白名单：不列 favs 就不会进备份（表名取自 db/schema.sql）
            ARGS+=(--table draws --table dlt_draws --table small_draws --table predlog --table sync_log)
            echo "已按配置剔除 favs（个人收藏）表"
          fi
          # ⚠️ wrangler 会把一条预签名 R2 链接打到 stdout，里面带 X-Amz-Credential 与 X-Amz-Signature，
          # 一小时内谁拿到都能直接下载整库。公开仓库的 Actions 日志对任何人可见 —— 必须过滤掉再落日志。
          if ! npx --yes "wrangler@$WRANGLER_VERSION" "${ARGS[@]}" > /tmp/export.log 2>&1; then
            grep -v "r2.cloudflarestorage.com" /tmp/export.log || true
            echo "::error::wrangler d1 export 失败（见上方日志，已隐去预签名链接）"
            exit 1
          fi
          grep -v "r2.cloudflarestorage.com" /tmp/export.log || true
          test -s "$OUT"                       # 空文件不算备份成功
          echo "导出 $(wc -l < "$OUT") 行 / $(du -h "$OUT" | cut -f1)"

      - name: 还原验证（备份没验过就等于没有备份）
        if: env.BACKUP_ENABLED == '1'
        run: |
          set -euo pipefail
          command -v sqlite3 >/dev/null || { echo "::error::runner 上没有 sqlite3，无法验证还原"; exit 1; }
          rm -f /tmp/verify.db
          sqlite3 /tmp/verify.db ".read $OUT"
          echo "表 / 行数：" | tee -a "$GITHUB_STEP_SUMMARY"
          TOTAL=0
          for t in $(sqlite3 /tmp/verify.db "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"); do
            n=$(sqlite3 /tmp/verify.db "SELECT COUNT(*) FROM \"$t\"")
            TOTAL=$((TOTAL + n))
            echo "- \`$t\`：$n 行" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          # 全空只警告不报错：新部署的库本来就可能还没落库；但还原失败（上一条命令非 0）一定是红
          if [ "$TOTAL" -eq 0 ]; then
            echo "::warning::还原后所有表都是 0 行——若这不是你预期的状态，请检查 D1_DATABASE 是否指向了正确的库"
          fi
          echo "备份可还原，总计 $TOTAL 行" 

      - name: 推到 R2（配了 R2_BUCKET 时）
        if: env.BACKUP_ENABLED == '1' && env.R2_BUCKET != ''
        run: |
          set -euo pipefail
          KEY="d1-backup/$OUT"
          npx --yes "wrangler@$WRANGLER_VERSION" r2 object put "$R2_BUCKET/$KEY" --file "$OUT" --content-type "application/sql"
          echo "已推送到 \`r2://$R2_BUCKET/$KEY\`（私有桶，凭 Token 才能取）" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 上传 Actions 产物（未配 R2 时的兜底）
        if: env.BACKUP_ENABLED == '1' && env.R2_BUCKET == ''
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_number }}
          path: backup-*.sql
          retention-days: 90
          if-no-files-found: error

      - name: 产物去向提示
        if: env.BACKUP_ENABLED == '1' && env.R2_BUCKET == ''
        run: |
          echo "### 这次备份放在了 Actions 产物里" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**注意**：如果这个仓库是**公开**的，产物任何人都能免登录下载（保留 90 天）。" >> "$GITHUB_STEP_SUMMARY"
          echo "三条更稳的路：① 配 \`vars.R2_BUCKET\` 推到私有 R2；② 把仓库转私有；③ 设 \`vars.BACKUP_INCLUDE_FAVS = 0\` 至少不把个人收藏带出去。" >> "$GITHUB_STEP_SUMMARY"
          echo "开奖数据本身是公开信息，真正的私人内容只有 \`favs\` 表。" >> "$GITHUB_STEP_SUMMARY"
