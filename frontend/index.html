<script>
const $ = s => document.querySelector(s);
const LOTS = [
  {id:'ssq',name:'双色球',mode:'rb'},
  {id:'dlt',name:'大乐透',mode:'rb'},
  {id:'fc3d',name:'福彩3D',mode:'digits',n:3},
  {id:'pl3',name:'排列3',mode:'digits',n:3},
  {id:'pl5',name:'排列5',mode:'digits',n:5},
  {id:'qlc',name:'七乐彩',mode:'qlc'},
  {id:'qxc',name:'七星彩',mode:'digits',n:7},
  {id:'kl8',name:'快乐8',mode:'nums',n:20}
];
const LOT = {}; LOTS.forEach(l => LOT[l.id] = l);
const sel = $('#lot');
LOTS.forEach(l => { const o = document.createElement('option'); o.value = l.id; o.textContent = l.name; sel.appendChild(o); });

$('#api').value = localStorage.getItem('lw_api') || (location.origin.indexOf('http') === 0 ? location.origin : '');
$('#tok').value = localStorage.getItem('lw_tok') || '';
$('#save').onclick = () => {
  localStorage.setItem('lw_api', $('#api').value.trim());
  localStorage.setItem('lw_tok', $('#tok').value.trim());
  load();
};
function base(){ return ($('#api').value || '').trim().replace(/\/+$/, ''); }
function headers(){ const t = ($('#tok').value || '').trim(); return t ? { Authorization: 'Bearer ' + t } : {}; }
async function api(path){
  const b = base();
  if (!b) throw new Error('请先填写 Worker 地址（保存后自动加载）');
  const r = await fetch(b + path, { headers: headers() });
  const txt = await r.text();
  let j = null;
  try { j = JSON.parse(txt); } catch (e) { throw new Error('响应不是 JSON（HTTP ' + r.status + '）：' + txt.slice(0, 200)); }
  if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
  return j;
}
function pad2(x){ return String(x).padStart(2, '0'); }
// 后端字段类型不统一：双色球的 blue 是字符串 "15"，大乐透的 back 是数组。
// 统一在这里收敛，避免 "(arr || []).map is not a function"。
function asArr(x){ if (x == null) return []; return Array.isArray(x) ? x : [x]; }
function balls(arr, cls){ return asArr(arr).map(x => '<span class="ball ' + (cls || '') + '">' + x + '</span>').join(''); }
function esc(s){ return String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function errBox(e, el){ el.innerHTML = '<div class="err">请求失败：' + esc(e.message || e) + '</div>'; }
function renderNums(o){
  if (!o) return '';
  if (o.digits) return balls(o.digits);
  if (o.nums) return o.nums.map(n => '<span class="ball">' + n + '</span>').join('');
  if (o.main) return balls(o.main) + (o.special ? ' <span class="muted">特别</span>' + balls([o.special], 'b') : '');
  if (o.front) return balls(o.front) + balls(o.back, 'b');
  if (o.red) return balls(o.red) + balls(o.blue, 'b');
  return '';
}

// ---------- 标签页 ----------
document.querySelectorAll('header button[data-t]').forEach(b => b.onclick = () => {
  document.querySelectorAll('header button[data-t]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  ['p','a','h','v','t','f'].forEach(id => { const e = document.getElementById(id); if (e) e.style.display = id === b.dataset.t ? '' : 'none'; });
  if (b.dataset.t === 'a' && window.__chart) setTimeout(() => window.__chart.resize(), 0);
  if (b.dataset.t === 'f') loadFavs();
});
sel.onchange = load;

// ---------- 主流程 ----------
async function load(){
  const id = sel.value;
  $('#st').textContent = '加载中…';
  try {
    await loadPredict(id);
    $('#st').textContent = '已加载：' + LOT[id].name + ' · ' + new Date().toLocaleString();
  } catch (e) {
    $('#st').textContent = '加载失败';
    errBox(e, $('#p'));
  }
  buildVerify(id);
  buildTools(id);
}

// 8 个彩种共用一套展示：后端 /api/{kind}/predict 返回统一结构 {picks:[{name,main,aux|digits,score}],kill,dan}
async function loadPredict(id){
  const [latest, rec] = await Promise.all([
    api('/api/' + id + '/latest'),
    api('/api/' + id + '/predict?win=30')
  ]);
  const isDigit = Array.isArray(latest.digits);
  let html = '<h3 style="margin:0 0 8px">' + esc(latest.code || '') + ' 期</h3>' + renderNums(latest);
  html += '<div class="muted">' + esc(latest.date || '') + ' · 源 ' + esc(((latest.sources || [latest.src]).join(',') || '-')) + '</div>';
  html += '<h4 style="margin:14px 0 6px">6 组参考（含结构分）</h4>';
  for (const p of (rec.picks || [])) {
    html += '<div class="kv"><span>' + esc(p.name) + ' <span class="muted">分 ' + esc(p.score) + '</span></span><span>' +
      (isDigit ? balls(p.digits) : balls(p.main) + balls(p.aux, 'b')) + '</span></div>';
  }
  html += '<p class="muted">' + esc(rec.disclaimer || '') + '</p>';
  const dl = rec.dan || {};
  let kl = rec.kill || {}, killTag = '';
  try {
    const ck = await api('/api/kill-calibrated?kind=' + id);
    if (ck.main && ck.main.length) { kl = ck; killTag = '（已按回测校准公式权重）'; }
  } catch (e2) { /* 校准失败退回普通杀号 */ }
  if (kl.main && kl.main.length) {
    html += '<h4 style="margin:14px 0 6px">杀号' + killTag + '</h4><div class="muted">' +
      kl.main.slice(0, 12).map(x => esc(x.n) + '(' + esc(x.votes) + ')').join(' ') + '</div>';
  } else if (kl.perPos) {
    html += '<h4 style="margin:14px 0 6px">分位杀号</h4><div class="muted">' +
      kl.perPos.map(pp => '第' + pp.pos + '位 ' + pp.kill.slice(0, 3).map(x => esc(x.n)).join(',')).join('　') + '</div>';
  }
  if (dl.main && dl.main.length) {
    html += '<h4 style="margin:14px 0 6px">胆码</h4><div>' + balls(dl.main.slice(0, 5).map(x => x.n)) +
      (dl.aux && dl.aux.length ? ' <span class="muted">副区</span>' + balls(dl.aux.slice(0, 2).map(x => x.n), 'b') : '') + '</div>';
  } else if (dl.perPos) {
    html += '<h4 style="margin:14px 0 6px">分位胆码</h4><div class="muted">' +
      dl.perPos.map(pp => '第' + pp.pos + '位 ' + pp.dan.slice(0, 3).map(x => esc(x.n)).join(',')).join('　') + '</div>';
  }
  html += '<h4 style="margin:14px 0 6px">胆拖投注单</h4><div class="row">' +
    '<input id="tkd" placeholder="胆数" style="width:70px" value="2">' +
    '<input id="tkt" placeholder="拖数" style="width:70px" value="6">' +
    '<button id="tkgo">生成胆拖单</button></div><div id="tkout" class="muted"></div>';
  if (rec.formHint) html += '<div class="muted">近 ' + esc(rec.count) + ' 期形态：组三 ' + esc(rec.formHint['组三']) +
    ' / 组六 ' + esc(rec.formHint['组六']) + ' / 豹子 ' + esc(rec.formHint['豹子']) + '</div>';
  $('#p').innerHTML = html;
  const tkgo = document.getElementById('tkgo');
  if (tkgo) tkgo.onclick = async () => {
    const out = document.getElementById('tkout');
    try {
      const r = await api('/api/ticket?kind=' + id + '&dan=' + encodeURIComponent($('#tkd').value.trim() || 2) + '&tuo=' + encodeURIComponent($('#tkt').value.trim() || 6));
      out.innerHTML = r.dan
        ? '<div>胆 ' + balls(r.dan) + '　拖 ' + balls(r.tuo) + (r.aux && r.aux.length ? '　副区 ' + balls(r.aux, 'b') : '') + '</div>' +
          '<div><b>' + esc(r.bets) + ' 注 / ' + esc(r.amount) + ' 元</b>　<span class="muted">已剔除 ' + esc(r.excluded) + ' 个杀号</span></div>' +
          '<div class="muted">' + esc(r.note) + '</div>'
        : '<div class="muted">' + esc(r.note || '该彩种不支持胆拖') + '</div>';
    } catch (e) { errBox(e, out); }
  };
  await loadAnalyze(id);
  await loadHistory(id);
}

// ---------- 分析 ----------
function drawChart(title, cats, vals){
  const el = document.getElementById('chart');
  if (typeof echarts === 'undefined') { el.innerHTML = '<div class="muted">图表库未加载（离线或 CDN 被拦截），下方统计数值仍可用。</div>'; return; }
  if (!window.__chart) window.__chart = echarts.init(el);
  window.__chart.setOption({
    title: { text: title, textStyle: { fontSize: 14 } },
    grid: { left: 40, right: 12, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: cats, axisLabel: { fontSize: 10 } },
    yAxis: { type: 'value', minInterval: 1 },
    series: [{ type: 'bar', data: vals, itemStyle: { color: '#e11' } }]
  }, true);
}

// 统一分析：号码池型看频次/遗漏/形态，数字型按位看冷热
async function loadAnalyze(id){
  try {
    const an = await api('/api/' + id + '/analyze?win=30');
    if (an.perPos) {
      const p0 = an.perPos[0], ks = Object.keys(p0.freq).sort();
      drawChart(LOT[id].name + ' 第 1 位频次（近 ' + an.count + ' 期）', ks, ks.map(k => p0.freq[k]));
      $('#stats').innerHTML = an.perPos.map(p =>
        '第' + p.pos + '位　热 ' + esc(p.hot.join(',')) + '　冷 ' + esc(p.cold.join(','))).join('<br>') +
        '<br>平均和值 ' + esc(an.avgSum) + '　平均大数个数 ' + esc(an.avgBigSmall) +
        (an.form ? '<br>近 ' + esc(an.count) + ' 期形态：组三 ' + esc(an.form.group3) +
          ' / 组六 ' + esc(an.form.group6) + ' / 豹子 ' + esc(an.form.bail) : '');
    }
    const ks = Object.keys(an.freq || {}).sort();
    drawChart(LOT[id].name + ' 号码频次（近 ' + an.count + ' 期）', ks, ks.map(k => an.freq[k]));
    const om = an.omission || {};
    const maxOm = om.max ? Math.max.apply(null, Object.values(om.max)) : '-';
    const auxTop = an.auxFreq && Object.keys(an.auxFreq).length
      ? Object.entries(an.auxFreq).sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => x[0]).join(',') : '';
    $('#stats').innerHTML =
      '热号 ' + esc((an.hot || []).join(',')) + '　冷号 ' + esc((an.cold || []).join(',')) + '<br>' +
      '奇偶比 ' + esc(an.oddRatio) + '　大小比 ' + esc(an.bigRatio) + '　质合比 ' + esc(an.primeRatio) + '<br>' +
      '均和 ' + esc(an.avgSum) + '　平均AC ' + esc(an.avgAC) + '　平均连号 ' + esc(an.avgConsec) + '　平均重号 ' + esc(an.avgRepeat) + '<br>' +
      '012路 ' + esc((an.road012 || []).join('/')) + '　区间分布 ' + esc((an.zoneDist || []).join('/')) + '<br>' +
      '历史最大遗漏 ' + esc(maxOm) + ' 期' + (auxTop ? '<br>副区高频 ' + esc(auxTop) : '') +
      '<br><b>当前遗漏 Top10</b>　' + Object.entries(om.cur || {}).sort((a, b) => b[1] - a[1]).slice(0, 10)
        .map(([k, v]) => esc(k) + '(' + v + '期·均值' + esc(om.avg[k] != null ? om.avg[k] : '-') + ')').join(' ');
    await loadBacktest(id);
  } catch (e) { errBox(e, $('#a')); }
}

// 回测摘要：策略/杀号历史表现 vs 随机基线（失败不影响主统计展示）
async function loadBacktest(id){
  try {
    const bt = await api('/api/backtest?kind=' + id);
    let extra = '';
    if (bt.strategies) {
      extra = '<b>回测</b>（近 ' + esc(bt.periods) + ' 期 · 单号基线 ' + (bt.baseline * 100).toFixed(1) + '%）：热号均中 ' +
        esc(bt.strategies.hot.avgHit) + ' / 冷号均中 ' + esc(bt.strategies.cold.avgHit) + ' / 胆码均中 ' +
        esc(bt.strategies.dan.avgHit) + '（胆基线 ' + esc(bt.strategies.dan.baseline) + '）<br>杀号命中率 ' +
        (bt.kill.hitRate * 100).toFixed(1) + '% vs 随机基线 ' + (bt.kill.baseline * 100).toFixed(1) + '% → <b>' + esc(bt.kill.verdict) + '</b>';
      if (bt.aux) extra += '　副区热号命中 ' + (bt.aux.hot.hitRate * 100).toFixed(1) + '%（基线 ' + (bt.aux.hot.baseline * 100).toFixed(1) + '%）';
      const fs = (bt.kill.formulas || []).filter(f => f.killed > 0);
      if (fs.length) extra += '<br><b>杀号公式校准</b>（基线 ' + (bt.kill.baseline * 100).toFixed(1) + '%，√=低于基线）：' +
        fs.map(f => esc(f.label) + ' ' + (f.rate * 100).toFixed(1) + '%' + (f.verdict === '有效' ? '√' : '—')).join('　');
    } else if (bt.perPos) {
      const avgOf = key => bt.perPos.reduce((a, r) => a + (r[key] || 0), 0) / bt.perPos.length;
      const kr = bt.perPos.filter(r => r.killRate != null);
      extra = '<b>回测</b>（近 ' + esc(bt.periods) + ' 期 · 单位基线 10%）：各位热号均中率 ' + (avgOf('hotRate') * 100).toFixed(1) +
        '% / 冷号均中率 ' + (avgOf('coldRate') * 100).toFixed(1) + '%' +
        (kr.length ? ' / 首位杀号命中率 ' + ((kr.reduce((a, r) => a + r.killRate, 0) / kr.length) * 100).toFixed(1) + '%' : '');
    }
    if (bt.note) extra += '<br><span>' + esc(bt.note) + '</span>';
    if (extra) $('#stats').innerHTML += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #eee" class="muted">' + extra + '</div>';
  } catch (e2) { /* 回测接口失败时保持主统计展示 */ }
}

// ---------- 历史 ----------
async function loadHistory(id){
  try {
    const his = await api('/api/' + id + '/history?limit=30');
    let h = '<h3 style="margin:0 0 8px">历史 30 期</h3><table><tr><th>期号</th><th>号码</th><th>日期</th></tr>';
    for (const d of his) h += '<tr><td>' + esc(d.code) + '</td><td>' + renderNums(d) + '</td><td>' + esc(d.date || '') + '</td></tr>';
    $('#h').innerHTML = h + '</table>';
  } catch (e) { errBox(e, $('#h')); }
}

// ---------- 工具：注数/金额/追号 与 中奖计算器 ----------
const CALC_FIELDS = {
  ssq: [['red', '红球个数', 90], ['blue', '蓝球个数', 90], ['dan', '胆码数', 80], ['tuo', '拖码数', 80]],
  dlt: [['front', '前区个数', 90], ['back', '后区个数', 90], ['fdan', '前区胆', 80], ['ftuo', '前区拖', 80], ['bdan', '后区胆', 80], ['btuo', '后区拖', 80]],
  qlc: [['main', '基本号个数', 100], ['dan', '胆码数', 80], ['tuo', '拖码数', 80]],
  kl8: [['pick', '选几(1-10)', 90], ['nums', '选号个数', 90]]
};
const PRIZE_FIELDS = {
  kl8: [['pick', '选几', 80], ['hit', '命中个数', 90]],
  fc3d: [['bet', '你的号码(3位)', 160], ['draw', '开奖号(3位)', 160]],
  pl3: [['bet', '你的号码(3位)', 160], ['draw', '开奖号(3位)', 160]],
  ssq: [['hitMain', '命中红球', 90], ['hitAux', '中蓝球(1/0)', 100]],
  dlt: [['hitMain', '命中前区', 90], ['hitAux', '命中后区', 90]],
  qlc: [['hitMain', '命中基本号', 90], ['hitAux', '中特别号(1/0)', 100]]
};
function buildTools(id){
  const cf = CALC_FIELDS[id] || [['pos', '各位可选个数(逗号)', 200], ['group', '组选 3/6', 80]];
  const pf = PRIZE_FIELDS[id] || [['exact', '是否全中(1/0)', 120]];
  const inputs = (arr) => arr.map(f => '<input data-f="' + f[0] + '" placeholder="' + f[1] + '" style="width:' + f[2] + 'px">').join('');
  $('#t').innerHTML =
    '<h3 style="margin:0 0 8px">注数 / 金额 / 追号</h3><div class="row" id="crow">' + inputs(cf) +
    '<input data-f="chase" placeholder="追号期数" style="width:100px">' +
    '<input data-f="mults" placeholder="倍数序列 1,2,4" style="width:150px"></div>' +
    '<div class="row"><button id="cgo">计算注数</button></div><div id="cout" class="muted"></div>' +
    '<h3 style="margin:16px 0 8px">中奖计算器</h3><div class="row" id="prow">' + inputs(pf) + '</div>' +
    '<div class="row"><button id="pgo">判定奖级</button></div><div id="pout" class="muted"></div>';
  const q = (row) => [...row.querySelectorAll('input[data-f]')]
    .filter(i => i.value.trim() !== '')
    .map(i => i.dataset.f + '=' + encodeURIComponent(i.value.trim())).join('&');
  $('#cgo').onclick = async () => {
    try {
      const r = await api('/api/calc?kind=' + id + '&' + q($('#crow')));
      let h = '<div class="card"><b>' + esc(r.bets) + ' 注 · ' + esc(r.amount) + ' 元</b>' +
        '<div class="muted">' + esc(r.mode === 'dantuo' ? '胆拖' : '复式') + '　' + esc(r.formula) + '</div>';
      if (r.chase && r.chase.plan) {
        h += '<div class="muted">追号 ' + esc(r.chase.periods) + ' 期　合计 ' + esc(r.chase.totalBets) +
          ' 注 / ' + esc(r.chase.totalAmount) + ' 元</div>' +
          r.chase.plan.map(p => '<div class="kv"><span>第 ' + p.period + ' 期 ×' + esc(p.mult) + '</span><span>' +
            esc(p.bets) + ' 注 / ' + esc(p.amount) + ' 元</span></div>').join('');
      }
      $('#cout').innerHTML = h + '<div class="muted">' + esc(r.note || '') + '</div></div>';
    } catch (e) { errBox(e, $('#cout')); }
  };
  $('#pgo').onclick = async () => {
    try {
      const r = await api('/api/prize?kind=' + id + '&' + q($('#prow')));
      $('#pout').innerHTML = '<div class="card"><b>' + esc(r.prize) + '</b>' +
        (r.amount ? ' <span class="muted">参考 ' + esc(r.amount) + ' 元</span>' : '') +
        '<div class="muted">' + esc(r.note || '') + '</div></div>';
    } catch (e) { errBox(e, $('#pout')); }
  };
}

// ---------- 验奖 + 矩阵 ----------
function buildVerify(id){
  const l = LOT[id];
  let h = '<h3 style="margin:0 0 8px">验奖</h3><div class="row">' +
    '<input id="vc" placeholder="期号，如 2026103" style="width:150px">';
  if (l.mode === 'rb') {
    h += '<input id="vr" placeholder="' + (id === 'ssq' ? '红球 6 个' : '前区 5 个') + '，逗号分隔" style="flex:1;min-width:180px">' +
         '<input id="vb" placeholder="' + (id === 'ssq' ? '蓝球 1 个' : '后区 2 个') + '" style="width:140px">';
  } else {
    h += '<input id="vn" placeholder="号码，逗号分隔" style="flex:1;min-width:220px">';
  }
  h += '<button id="vgo">验奖</button></div><div id="vo"></div>';
  h += '<h3 style="margin:16px 0 8px">旋转矩阵（覆盖设计）</h3>' +
    '<div class="row"><input id="mn" placeholder="自选 n" style="width:100px" value="12">' +
    '<input id="mp" placeholder="每注 k" style="width:90px" value="6">' +
    '<input id="mh" placeholder="保中 t" style="width:80px" value="4">' +
    '<button id="mgo">生成</button></div><div id="mo" class="muted"></div>';
  $('#v').innerHTML = h;

  $('#vgo').onclick = async () => {
    const out = $('#vo');
    try {
      const code = $('#vc').value.trim();
      let path;
      if (l.mode === 'rb') {
        const r = $('#vr').value.trim(), b = $('#vb').value.trim();
        path = '/api/' + id + '/verify?code=' + encodeURIComponent(code) +
          '&' + (id === 'ssq' ? 'red=' : 'front=') + encodeURIComponent(r) +
          '&' + (id === 'ssq' ? 'blue=' : 'back=') + encodeURIComponent(b);
      } else {
        path = '/api/' + id + '/verify?code=' + encodeURIComponent(code) + '&nums=' + encodeURIComponent($('#vn').value.trim());
      }
      const res = await api(path);
      if (!res.hit) { out.innerHTML = '<div class="muted">' + esc(res.note || '未命中') + '</div>'; return; }
      const bits = [];
      if (res.hitRed !== undefined) bits.push('红球 ' + res.hitRed);
      if (res.hitBlue !== undefined) bits.push('蓝球 ' + (res.hitBlue ? '中' : '未中'));
      if (res.hitFront !== undefined) bits.push('前区 ' + res.hitFront);
      if (res.hitBack !== undefined) bits.push('后区 ' + res.hitBack);
      if (res.hitMain !== undefined) bits.push('基本号 ' + res.hitMain);
      if (res.hitSpecial !== undefined) bits.push('特别号 ' + (res.hitSpecial ? '中' : '未中'));
      if (res.hitNums !== undefined) bits.push('命中 ' + res.hitNums + ' 个');
      if (res.posHit !== undefined) bits.push('按位 ' + res.posHit + '/' + res.total);
      out.innerHTML = '<div class="card"><b>' + esc(res.prize || '已匹配') + '</b><div class="muted">' + esc(bits.join('　')) +
        (res.note ? '<br>' + esc(res.note) : '') + '</div></div>';
    } catch (e) { errBox(e, out); }
  };

  $('#mgo').onclick = async () => {
    const out = $('#mo');
    try {
      const r = await api('/api/rotation?n=' + encodeURIComponent($('#mn').value.trim() || 12) +
        '&pick=' + encodeURIComponent($('#mp').value.trim() || 6) +
        '&hit=' + encodeURIComponent($('#mh').value.trim() || 4));
      if (r.error) { out.innerHTML = '<div class="err">' + esc(r.error) + '</div>'; return; }
      out.innerHTML = '<div><b>' + esc(r.blocks) + ' 注</b> · ' + esc(r.note) + '</div>' +
        r.combos.map((c, i) => '<div class="kv"><span>第 ' + (i + 1) + ' 注</span><span>' + balls(c) + '</span></div>').join('');
    } catch (e) { errBox(e, out); }
  };
}

// ---------- 收藏 ----------
async function loadFavs(){
  const el = $('#f');
  el.innerHTML = '<h3 style="margin:0 0 8px">收藏</h3>' +
    '<div class="row"><input id="fn" placeholder="号码，逗号分隔" style="flex:1;min-width:200px">' +
    '<input id="fno" placeholder="备注" style="width:140px">' +
    '<button id="fadd">添加</button></div><div id="flist" class="muted">加载中…</div>';
  $('#fadd').onclick = async () => {
    try {
      await fetch(base() + '/api/favs', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, headers()),
        body: JSON.stringify({ kind: sel.value, numbers: $('#fn').value.trim(), note: $('#fno').value.trim() })
      });
      $('#fn').value = ''; $('#fno').value = '';
      loadFavs();
    } catch (e) { errBox(e, $('#flist')); }
  };
  try {
    const list = await api('/api/favs');
    $('#flist').innerHTML = list.length
      ? list.map(x => '<div class="kv"><span>' + esc(x.kind) + ' · ' + esc(x.numbers) +
          (x.note ? ' <span class="muted">' + esc(x.note) + '</span>' : '') + '</span>' +
          '<button data-id="' + esc(x.id) + '" class="fdel">删除</button></div>').join('')
      : '<div class="muted">暂无收藏（需在 Worker 配置 D1 与 API_TOKEN）</div>';
    document.querySelectorAll('.fdel').forEach(b => b.onclick = async () => {
      await fetch(base() + '/api/favs?id=' + b.dataset.id, { method: 'DELETE', headers: headers() });
      loadFavs();
    });
  } catch (e) { errBox(e, $('#flist')); }
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
if ($('#api').value) load();
</script>
