<title>自用彩票 · 8 彩种</title>

<style>
body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;margin:0;background:#f6f7fb;color:#111}
header{position:sticky;top:0;z-index:9;background:#fff;padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}

<body data-page-node-id="nXdeuJrfZVOvMweYUzyI8n">
<header data-page-node-id="TVFfs5ASZ4VGzlZLadXPO4">
  <b data-page-node-id="haMk2daY7MdytropLt59td">自用彩票</b>
  <select id="lot" data-page-node-id="X9uymP9ZoqOgGHqrz0atjf"></select>
  <button class="on" data-t="p" data-page-node-id="iPeYUGDGF6fq6ZeqXwYHWC">预测</button>
  <button data-t="a" data-page-node-id="eErWbJuO3OQGIcMuAIfLs1">分析</button>
  <button data-t="h" data-page-node-id="zZ87FxSiEg7fRNzsuqDYtH">历史</button>
  <button data-t="v" data-page-node-id="IGGbA4so6NzuVLtkBBi2Qq">验奖·矩阵</button>
  <button data-t="f" data-page-node-id="0SYdguSKBUjII2VXvQ5LyW">收藏</button>
</header>

<div class="wrap" data-page-node-id="KFzJ0qIgqJfDmIioc6tTwE">
  <div class="card" id="cfg" data-page-node-id="g243c5lAFhFnjgGiAUtxDX">
    <div class="row" data-page-node-id="BHuT2grZsqz5LFyo1PxDlJ">
      <span class="muted" data-page-node-id="nNZ7BB8AaoaY58eCMFTaIW">Worker 地址</span>
      <input id="api" style="flex:1;min-width:220px" placeholder="https://lottery-web.xxx.workers.dev" data-page-node-id="Jha7VcsNZugLb0fpjvYyAu">
      <input id="tok" style="width:170px" placeholder="API_TOKEN（可选）" data-page-node-id="s6DEWIzfkWTV29qFbZnjkf">
      <button id="save" data-page-node-id="gCbqPgehaMHj0SZhGF1j2v">保存并加载</button>
    </div>
    <div class="muted" id="st" data-page-node-id="6beFFbZsZt4YM10QeGy6vK">未加载</div>
  </div>

  <div class="warn" data-page-node-id="Gtoyy98xsGm6RspZaW7EKb">随机游戏，统计仅供娱乐，不保证中奖。数据来自 500 / cwl / 17500 多源交叉校验。</div>

  <div id="p" class="card" data-page-node-id="O4IRRh453o6dSVKvLVSiQw">加载中…</div>
  <div id="a" class="card" style="display:none" data-page-node-id="T8v3apBHXKeL6vElBOz29a"><div id="chart" style="height:300px" data-page-node-id="F94RLhn7RTFlIxGwDpco5w"></div><div id="stats" class="muted" data-page-node-id="KLERzjPJDsyMYezfGpHd5W"></div></div>
  <div id="h" class="card" style="display:none" data-page-node-id="hD65Rjrk4hCm83ucPXhI0t"></div>
  <div id="v" class="card" style="display:none" data-page-node-id="E73QkA8micfJzuqG5tcuLv"></div>
  <div id="f" class="card" style="display:none" data-page-node-id="CvLNRGaVhm4i9UchgUEV5q"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const LOTS = [
  {id:'ssq',name:'双色球',mode:'rb'},
  {id:'dlt',name:'大乐透',mode:'rb'},
  {id:'fc3d',name:'福彩3D',mode:'digits',n:3},
  {id:'pl3',name:'排列3',mode:'digits',n:3},
  {id:'pl5',name:'排列5',mode:'digits',n:5},
  {id:'qlc',name:'七乐彩',mode:'qlc'},
  {id:'qxc',name:'七星彩',mode:'digits',n:7},
  {id:'kl8',name:'快乐8',mode:'nums',n:20}
];
const LOT = {}; LOTS.forEach(l => LOT[l.id] = l);
const sel = $('#lot');
LOTS.forEach(l => { const o = document.createElement('option'); o.value = l.id; o.textContent = l.name; sel.appendChild(o); });

$('#api').value = localStorage.getItem('lw_api') || (location.origin.indexOf('http') === 0 ? location.origin : '');
$('#tok').value = localStorage.getItem('lw_tok') || '';
$('#save').onclick = () => {
  localStorage.setItem('lw_api', $('#api').value.trim());
  localStorage.setItem('lw_tok', $('#tok').value.trim());
  load();
};
function base(){ return ($('#api').value || '').trim().replace(/\/+$/, ''); }
function headers(){ const t = ($('#tok').value || '').trim(); return t ? { Authorization: 'Bearer ' + t } : {}; }
async function api(path){
  const b = base();
  if (!b) throw new Error('请先填写 Worker 地址（保存后自动加载）');
  const r = await fetch(b + path, { headers: headers() });
  const txt = await r.text();
  let j = null;
  try { j = JSON.parse(txt); } catch (e) { throw new Error('响应不是 JSON（HTTP ' + r.status + '）：' + txt.slice(0, 200)); }
  if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
  return j;
}
function pad2(x){ return String(x).padStart(2, '0'); }
// 后端字段类型不统一：双色球的 blue 是字符串 "15"，大乐透的 back 是数组。
// 统一在这里收敛，避免 "(arr || []).map is not a function"。
function asArr(x){ if (x == null) return []; return Array.isArray(x) ? x : [x]; }
function balls(arr, cls){ return asArr(arr).map(x => '<span class="ball ' + (cls || '') + '">' + x + '</span>').join(''); }
function esc(s){ return String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function errBox(e, el){ el.innerHTML = '<div class="err">请求失败：' + esc(e.message || e) + '</div>'; }
function renderNums(o){
  if (!o) return '';
  if (o.digits) return balls(o.digits);
  if (o.nums) return o.nums.map(n => '<span class="ball">' + n + '</span>').join('');
  if (o.main) return balls(o.main) + (o.special ? ' <span class="muted">特别</span>' + balls([o.special], 'b') : '');
  if (o.front) return balls(o.front) + balls(o.back, 'b');
  if (o.red) return balls(o.red) + balls(o.blue, 'b');
  return '';
}

// ---------- 标签页 ----------
document.querySelectorAll('header button[data-t]').forEach(b => b.onclick = () => {
  document.querySelectorAll('header button[data-t]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  ['p','a','h','v','f'].forEach(id => { const e = document.getElementById(id); if (e) e.style.display = id === b.dataset.t ? '' : 'none'; });
  if (b.dataset.t === 'a' && window.__chart) setTimeout(() => window.__chart.resize(), 0);
  if (b.dataset.t === 'f') loadFavs();
});
sel.onchange = load;

// ---------- 主流程 ----------
async function load(){
  const id = sel.value;
  $('#st').textContent = '加载中…';
  try {
    if (LOT[id].mode === 'rb') await loadRB(id); else await loadSmall(id);
    $('#st').textContent = '已加载：' + LOT[id].name + ' · ' + new Date().toLocaleString();
  } catch (e) {
    $('#st').textContent = '加载失败';
    errBox(e, $('#p'));
  }
  buildVerify(id);
}

async function loadRB(id){
  const latest = await api('/api/' + id + '/latest');
  let html = '<h3 style="margin:0 0 8px">' + esc(latest.code || '') + ' 期</h3>' + renderNums(latest);
  html += '<div class="muted">' + esc(latest.date || '') + ' · 源 ' + esc(((latest.sources || [latest.src]).join(',') || '-')) + '</div>';
  if (id === 'ssq') {
    const rec = await api('/api/ssq/recommend');
    html += '<h4 style="margin:14px 0 6px">6 组参考（含结构分）</h4>';
    html += rec.picks.map(p =>
      '<div class="kv"><span>' + esc(p.name) + ' <span class="muted">分 ' + esc(p.score) + '</span></span>' +
      '<span>' + balls(p.red) + balls([p.blue], 'b') + '</span></div>').join('');
    html += '<p class="muted">' + esc(rec.disclaimer) + '</p>';
  } else {
    html += '<h4 style="margin:14px 0 6px">随机参考（该彩种暂无推荐接口）</h4>';
    for (let i = 0; i < 3; i++) html += '<div class="kv"><span>机选 ' + (i + 1) + '</span><span>' + renderNums(randPick(id)) + '</span></div>';
    html += '<p class="muted">大乐透仅提供统计与验奖，不做号码推荐。</p>';
  }
  $('#p').innerHTML = html;
  await loadAnalyzeRB(id);
  await loadHistory(id);
}

async function loadSmall(id){
  const latest = await api('/api/' + id + '/latest');
  let html = '<h3 style="margin:0 0 8px">' + esc(latest.code || '') + ' 期</h3>' + renderNums(latest);
  html += '<div class="muted">' + esc(latest.date || '') + '</div>';
  html += '<h4 style="margin:14px 0 6px">随机参考（该彩种暂无推荐接口）</h4>';
  for (let i = 0; i < 2; i++) html += '<div class="kv"><span>机选 ' + (i + 1) + '</span><span>' + renderNums(randPick(id)) + '</span></div>';
  $('#p').innerHTML = html;
  await loadAnalyzeSmall(id);
  await loadHistory(id);
}

function randPick(id){
  const l = LOT[id];
  const pick = (pool, n) => { const s = new Set(); while (s.size < n) s.add(pool[Math.floor(Math.random() * pool.length)]); return [...s].sort(); };
  const seq = n => Array.from({ length: n }, (_, i) => pad2(i + 1));
  if (id === 'ssq') return { red: pick(seq(33), 6), blue: [pad2(1 + Math.floor(Math.random() * 16))] };
  if (id === 'dlt') return { red: pick(seq(35), 5), blue: pick(seq(12), 2) };
  if (l.mode === 'digits') return { digits: Array.from({ length: l.n }, () => String(Math.floor(Math.random() * 10))) };
  if (l.mode === 'qlc') { const m = pick(seq(30), 8); return { main: m.slice(0, 7), special: m[7] }; }
  return { nums: pick(seq(80), 20) };
}

// ---------- 分析 ----------
function drawChart(title, cats, vals){
  const el = document.getElementById('chart');
  if (typeof echarts === 'undefined') { el.innerHTML = '<div class="muted">图表库未加载（离线或 CDN 被拦截），下方统计数值仍可用。</div>'; return; }
  if (!window.__chart) window.__chart = echarts.init(el);
  window.__chart.setOption({
    title: { text: title, textStyle: { fontSize: 14 } },
    grid: { left: 40, right: 12, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: cats, axisLabel: { fontSize: 10 } },
    yAxis: { type: 'value', minInterval: 1 },
    series: [{ type: 'bar', data: vals, itemStyle: { color: '#e11' } }]
  }, true);
}

async function loadAnalyzeRB(id){
  try {
    const an = await api('/api/' + id + '/analyze?win=30');
    const a = an.analysis || an;
    if (id === 'ssq') {
      const ks = Object.keys(a.redFreq).sort();
      drawChart('红球频次（近 30 期）', ks, ks.map(k => a.redFreq[k]));
      const om = a.omission || {};
      $('#stats').innerHTML =
        '热号 ' + esc(a.hotRed.join(',')) + '　冷号 ' + esc(a.coldRed.join(',')) + '<br>' +
        '奇偶比 ' + esc(a.oddRatio) + '　质合比 ' + esc(a.primeRatio) + '　均和 ' + esc(a.avgSum) + '　平均AC ' + esc(a.avgAC) + '<br>' +
        '012路 ' + esc(a.road012[0]) + '/' + esc(a.road012[1]) + '/' + esc(a.road012[2]) +
        '　平均连号 ' + esc(a.avgConsec) + '　平均重号 ' + esc(a.avgRepeat) + '<br>' +
        '蓝球首选 ' + esc(an.blue.top1) + '　候选池 ' + esc((an.blue.pool || []).join(',')) + '<br>' +
        '历史最大遗漏 ' + esc(om.max ? Math.max.apply(null, Object.values(om.max)) : '-') + ' 期';
    } else {
      const ks = Object.keys(a.frontFreq || {}).sort();
      drawChart('前区频次（近 30 期）', ks, ks.map(k => a.frontFreq[k]));
      $('#stats').innerHTML = '热前区 ' + esc((a.hotFront || []).join(',')) + '　热后区 ' + esc((a.hotBack || []).join(',')) + '　窗口 ' + esc(a.count) + ' 期';
    }
  } catch (e) { errBox(e, $('#a')); }
}

async function loadAnalyzeSmall(id){
  try {
    const his = await api('/api/' + id + '/history?limit=60');
    const f = {};
    for (const d of his) for (const x of (d.digits || d.main || d.nums || [])) f[x] = (f[x] || 0) + 1;
    const ks = Object.keys(f).sort();
    drawChart(LOT[id].name + ' 号码频次（近 ' + his.length + ' 期）', ks, ks.map(k => f[k]));
    const top = ks.slice().sort((a, b) => f[b] - f[a]).slice(0, 6);
    $('#stats').innerHTML = '样本 ' + esc(his.length) + ' 期　出现最多：' + esc(top.join(',')) + '<br>注：数字型玩法各位独立，频次仅供参考。';
  } catch (e) { errBox(e, $('#a')); }
}

// ---------- 历史 ----------
async function loadHistory(id){
  try {
    const his = await api('/api/' + id + '/history?limit=30');
    let h = '<h3 style="margin:0 0 8px">历史 30 期</h3><table><tr><th>期号</th><th>号码</th><th>日期</th></tr>';
    for (const d of his) h += '<tr><td>' + esc(d.code) + '</td><td>' + renderNums(d) + '</td><td>' + esc(d.date || '') + '</td></tr>';
    $('#h').innerHTML = h + '</table>';
  } catch (e) { errBox(e, $('#h')); }
}

// ---------- 验奖 + 矩阵 ----------
function buildVerify(id){
  const l = LOT[id];
  let h = '<h3 style="margin:0 0 8px">验奖</h3><div class="row">' +
    '<input id="vc" placeholder="期号，如 2026103" style="width:150px">';
  if (l.mode === 'rb') {
    h += '<input id="vr" placeholder="' + (id === 'ssq' ? '红球 6 个' : '前区 5 个') + '，逗号分隔" style="flex:1;min-width:180px">' +
         '<input id="vb" placeholder="' + (id === 'ssq' ? '蓝球 1 个' : '后区 2 个') + '" style="width:140px">';
  } else {
    h += '<input id="vn" placeholder="号码，逗号分隔" style="flex:1;min-width:220px">';
  }
  h += '<button id="vgo">验奖</button></div><div id="vo"></div>';
  h += '<h3 style="margin:16px 0 8px">旋转矩阵（覆盖设计）</h3>' +
    '<div class="row"><input id="mn" placeholder="自选 n" style="width:100px" value="12">' +
    '<input id="mp" placeholder="每注 k" style="width:90px" value="6">' +
    '<input id="mh" placeholder="保中 t" style="width:80px" value="4">' +
    '<button id="mgo">生成</button></div><div id="mo" class="muted"></div>';
  $('#v').innerHTML = h;

  $('#vgo').onclick = async () => {
    const out = $('#vo');
    try {
      const code = $('#vc').value.trim();
      let path;
      if (l.mode === 'rb') {
        const r = $('#vr').value.trim(), b = $('#vb').value.trim();
        path = '/api/' + id + '/verify?code=' + encodeURIComponent(code) +
          '&' + (id === 'ssq' ? 'red=' : 'front=') + encodeURIComponent(r) +
          '&' + (id === 'ssq' ? 'blue=' : 'back=') + encodeURIComponent(b);
      } else {
        path = '/api/' + id + '/verify?code=' + encodeURIComponent(code) + '&nums=' + encodeURIComponent($('#vn').value.trim());
      }
      const res = await api(path);
      if (!res.hit) { out.innerHTML = '<div class="muted">' + esc(res.note || '未命中') + '</div>'; return; }
      const bits = [];
      if (res.hitRed !== undefined) bits.push('红球 ' + res.hitRed);
      if (res.hitBlue !== undefined) bits.push('蓝球 ' + (res.hitBlue ? '中' : '未中'));
      if (res.hitFront !== undefined) bits.push('前区 ' + res.hitFront);
      if (res.hitBack !== undefined) bits.push('后区 ' + res.hitBack);
      if (res.hitMain !== undefined) bits.push('基本号 ' + res.hitMain);
      if (res.hitSpecial !== undefined) bits.push('特别号 ' + (res.hitSpecial ? '中' : '未中'));
      if (res.hitNums !== undefined) bits.push('命中 ' + res.hitNums + ' 个');
      if (res.posHit !== undefined) bits.push('按位 ' + res.posHit + '/' + res.total);
      out.innerHTML = '<div class="card"><b>' + esc(res.prize || '已匹配') + '</b><div class="muted">' + esc(bits.join('　')) +
        (res.note ? '<br>' + esc(res.note) : '') + '</div></div>';
    } catch (e) { errBox(e, out); }
  };

  $('#mgo').onclick = async () => {
    const out = $('#mo');
    try {
      const r = await api('/api/rotation?n=' + encodeURIComponent($('#mn').value.trim() || 12) +
        '&pick=' + encodeURIComponent($('#mp').value.trim() || 6) +
        '&hit=' + encodeURIComponent($('#mh').value.trim() || 4));
      if (r.error) { out.innerHTML = '<div class="err">' + esc(r.error) + '</div>'; return; }
      out.innerHTML = '<div><b>' + esc(r.blocks) + ' 注</b> · ' + esc(r.note) + '</div>' +
        r.combos.map((c, i) => '<div class="kv"><span>第 ' + (i + 1) + ' 注</span><span>' + balls(c) + '</span></div>').join('');
    } catch (e) { errBox(e, out); }
  };
}

// ---------- 收藏 ----------
async function loadFavs(){
  const el = $('#f');
  el.innerHTML = '<h3 style="margin:0 0 8px">收藏</h3>' +
    '<div class="row"><input id="fn" placeholder="号码，逗号分隔" style="flex:1;min-width:200px">' +
    '<input id="fno" placeholder="备注" style="width:140px">' +
    '<button id="fadd">添加</button></div><div id="flist" class="muted">加载中…</div>';
  $('#fadd').onclick = async () => {
    try {
      await fetch(base() + '/api/favs', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, headers()),
        body: JSON.stringify({ kind: sel.value, numbers: $('#fn').value.trim(), note: $('#fno').value.trim() })
      });
      $('#fn').value = ''; $('#fno').value = '';
      loadFavs();
    } catch (e) { errBox(e, $('#flist')); }
  };
  try {
    const list = await api('/api/favs');
    $('#flist').innerHTML = list.length
      ? list.map(x => '<div class="kv"><span>' + esc(x.kind) + ' · ' + esc(x.numbers) +
          (x.note ? ' <span class="muted">' + esc(x.note) + '</span>' : '') + '</span>' +
          '<button data-id="' + esc(x.id) + '" class="fdel">删除</button></div>').join('')
      : '<div class="muted">暂无收藏（需在 Worker 配置 D1 与 API_TOKEN）</div>';
    document.querySelectorAll('.fdel').forEach(b => b.onclick = async () => {
      await fetch(base() + '/api/favs?id=' + b.dataset.id, { method: 'DELETE', headers: headers() });
      loadFavs();
    });
  } catch (e) { errBox(e, $('#flist')); }
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
if ($('#api').value) load();
</script>
</body>
</html>
