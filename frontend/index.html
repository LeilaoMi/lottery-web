<script>
const $ = s => document.querySelector(s);
const LOTS = [
  {id:'ssq',name:'双色球',mode:'rb'},
  {id:'dlt',name:'大乐透',mode:'rb'},
  {id:'fc3d',name:'福彩3D',mode:'digits',n:3},
  {id:'pl3',name:'排列3',mode:'digits',n:3},
  {id:'pl5',name:'排列5',mode:'digits',n:5},
  {id:'qlc',name:'七乐彩',mode:'qlc'},
  {id:'qxc',name:'七星彩',mode:'digits',n:7},
  {id:'kl8',name:'快乐8',mode:'nums',n:20}
];
const LOT = {}; LOTS.forEach(l => LOT[l.id] = l);
const sel = $('#lot');
LOTS.forEach(l => { const o = document.createElement('option'); o.value = l.id; o.textContent = l.name; sel.appendChild(o); });

$('#api').value = localStorage.getItem('lw_api') || (location.origin.indexOf('http') === 0 ? location.origin : '');
$('#tok').value = localStorage.getItem('lw_tok') || '';
$('#save').onclick = () => {
  localStorage.setItem('lw_api', $('#api').value.trim());
  localStorage.setItem('lw_tok', $('#tok').value.trim());
  load();
};
function base(){ return ($('#api').value || '').trim().replace(/\/+$/, ''); }
function headers(){ const t = ($('#tok').value || '').trim(); return t ? { Authorization: 'Bearer ' + t } : {}; }
async function api(path){
  const b = base();
  if (!b) throw new Error('请先填写 Worker 地址（保存后自动加载）');
  const r = await fetch(b + path, { headers: headers() });
  const txt = await r.text();
  let j = null;
  try { j = JSON.parse(txt); } catch (e) { throw new Error('响应不是 JSON（HTTP ' + r.status + '）：' + txt.slice(0, 200)); }
  if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
  return j;
}
function pad2(x){ return String(x).padStart(2, '0'); }
async function apiPost(path, body){
  const b = base();
  if (!b) throw new Error('请先填写 Worker 地址（保存后自动加载）');
  const r = await fetch(b + path, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, headers()), body: JSON.stringify(body) });
  const txt = await r.text();
  let j = null;
  try { j = JSON.parse(txt); } catch (e) { throw new Error('响应不是 JSON（HTTP ' + r.status + '）：' + txt.slice(0, 200)); }
  if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
  return j;
}
// 后端字段类型不统一：双色球的 blue 是字符串 "15"，大乐透的 back 是数组。
// 统一在这里收敛，避免 "(arr || []).map is not a function"。
function asArr(x){ if (x == null) return []; return Array.isArray(x) ? x : [x]; }
function balls(arr, cls){ return asArr(arr).map(x => '<span class="ball ' + (cls || '') + '">' + x + '</span>').join(''); }
function esc(s){ return String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function errBox(e, el){ el.innerHTML = '<div class="err">请求失败：' + esc(e.message || e) + '</div>'; }
function renderNums(o){
  if (!o) return '';
  if (o.digits) return balls(o.digits);
  if (o.nums) return o.nums.map(n => '<span class="ball">' + n + '</span>').join('');
  if (o.main) return balls(o.main) + (o.special ? ' <span class="muted">特别</span>' + balls([o.special], 'b') : '');
  if (o.front) return balls(o.front) + balls(o.back, 'b');
  if (o.red) return balls(o.red) + balls(o.blue, 'b');
  return '';
}

// ---------- 标签页 ----------
document.querySelectorAll('header button[data-t]').forEach(b => b.onclick = () => {
  document.querySelectorAll('header button[data-t]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  ['d','p','a','h','v','t','f'].forEach(id => { const e = document.getElementById(id); if (e) e.style.display = id === b.dataset.t ? '' : 'none'; });
  if (b.dataset.t === 'a' && window.__chart) setTimeout(() => window.__chart.resize(), 0);
  if (b.dataset.t === 'a' && window.__chart2) setTimeout(() => window.__chart2.resize(), 0);
  if (b.dataset.t === 'a' && window.__chart3) setTimeout(() => window.__chart3.resize(), 0);
  if (b.dataset.t === 'd') loadDaily();
  if (b.dataset.t === 'f') loadFavs();
});
sel.onchange = load;

// ---------- 主流程 ----------
async function load(){
  const id = sel.value;
  $('#st').textContent = '加载中…';
  try {
    await loadPredict(id);
    $('#st').textContent = '已加载：' + LOT[id].name + ' · ' + new Date().toLocaleString();
  } catch (e) {
    $('#st').textContent = '加载失败';
    errBox(e, $('#p'));
  }
  loadStale();
  buildVerify(id);
  buildTools(id);
}

// 数据新鲜度保险丝：/api/meta 的 stale 显示 D1 最新一期距今天数，任一彩种 ≥4 天 → 黄条提醒
// （Actions 定时同步停摆 / 上游改版时，用户不至于拿过期数据当最新预测）
// 另加复盘对账停摆告警：predlog 里 days 全缺 / latestChecked 全空 = 对账循环没在跑，复盘页数字不可信
let __staleSig = '';
async function loadStale(){
  try {
    const m = await api('/api/meta');
    const anchor = document.querySelector('.warn');
    const putBar = (bar) => { if (anchor) anchor.parentNode.insertBefore(bar, anchor); };
    // ① 开奖数据过期
    const bad = (m.stale || []).filter(x => x.days >= 4);
    const old = document.getElementById('stalebar');
    if (!bad.length) { if (old) old.remove(); }
    else {
      const sig = bad.map(x => x.kind + x.days).join(',');
      if (!old || sig !== __staleSig) {
        __staleSig = sig;
        const bar = document.createElement('div');
        bar.className = 'warn'; bar.id = 'stalebar';
        bar.style.cssText = 'background:#fff1b8;border-color:#e6c35c;color:#6d4c00;font-weight:600';
        bar.innerHTML = '⚠️ 数据可能过期（同步任务停摆？）：' +
          bad.map(x => esc(x.name) + ' 最新 ' + esc(x.date) + '（' + x.days + ' 天前）').join('、') +
          '。以下预测请谨慎参考。';
        if (old) old.remove();
        putBar(bar);
      }
    }
    // ② 预测复盘未运行/未对账（predlog 后端未部署时字段缺失 → 不告警，不误伤）
    const pl = m.predlog || [];
    const revDead = pl.length > 0 && (pl.every(x => x.days == null) || pl.every(x => x.latestChecked == null));
    const old2 = document.getElementById('revwarnbar');
    if (!revDead) { if (old2) old2.remove(); }
    else if (!old2) {
      const bar2 = document.createElement('div');
      bar2.className = 'warn'; bar2.id = 'revwarnbar';
      bar2.style.cssText = 'background:#fff1f0;border-color:#ffa39e;color:#a8071a;font-weight:600';
      bar2.innerHTML = '🔴 预测复盘未运行/未对账，复盘页数字不可信：' +
        pl.map(x => esc(x.name || x.kind) + (x.unreconciled != null ? '（待对账 ' + esc(x.unreconciled) + ' 期）' : '')).join('、') +
        '。快照从未被对账时，滚动命中率与对账明细均不可采信。';
      putBar(bar2);
    }
  } catch (e) { /* meta 失败不影响主流程 */ }
}

// ---------- 今日日报：开奖日历 + 上期对账 + 下期快照 + 破纪录遗漏 ----------
const WEEK = '日一二三四五六';
const LOT_DAYS = { ssq: '二四日', dlt: '一三六', fc3d: '每日', pl3: '每日', pl5: '每日', qlc: '一三五', qxc: '二五日', kl8: '每日' };
async function loadDaily(){
  const el = $('#d');
  const today = new Date(), w = WEEK[today.getDay()];
  el.innerHTML = '<h3 style="margin:0 0 8px">今日日报（' + today.toLocaleDateString() + ' 周' + w + '）</h3><div class="muted">加载中…</div>';
  const drawing = LOTS.filter(l => (LOT_DAYS[l.id] || '').includes(w) || LOT_DAYS[l.id] === '每日');
  const chips = LOTS.map(l => {
    const on = drawing.includes(l);
    return '<span class="ball' + (on ? '' : ' b') + '" style="min-width:0;border-radius:6px;padding:0 8px;' + (on ? '' : 'background:#bbb;text-decoration:line-through') + '">' + esc(l.name) + '</span>';
  }).join('');
  let h = '<div class="row">' + chips + '<span class="muted">红=今日开奖 · 灰=休市</span></div>';
  const box = sec => '<div class="muted">加载中…</div>';
  h += '<h3 style="margin:14px 0 6px">破纪录遗漏预警</h3><div id="drec">' + box() + '</div>';
  h += '<h3 style="margin:14px 0 6px">上期对账（最新已开奖快照）</h3><div id="drev">' + box() + '</div>';
  h += '<h3 style="margin:14px 0 6px">下期快照（待开奖）</h3><div id="dsnap">' + box() + '</div>';
  el.innerHTML = h;
  // ① 破纪录遗漏：/api/records 全彩种，破纪录红标、逼近黄标
  api('/api/records').then(r => {
    const rec = r.records || {};
    let t = '<table><tr><th>彩种</th><th>破纪录</th><th>逼近纪录（≥80%）</th><th>当前遗漏最深</th></tr>';
    for (const l of LOTS) {
      const x = rec[l.id];
      if (!x) { t += '<tr><td>' + esc(l.name) + '</td><td colspan="3" class="muted">无数据</td></tr>'; continue; }
      const fmt = arr => (arr || []).map(i => '<b style="color:#c00">' + esc(i.label) + '</b>(' + i.cur + '/' + i.best + ')').join('、') || '<span class="muted">—</span>';
      const fmtN = arr => (arr || []).map(i => '<b style="color:#b60">' + esc(i.label) + '</b>(' + i.cur + '/' + i.best + ')').join('、') || '<span class="muted">—</span>';
      t += '<tr><td>' + esc(l.name) + '<div class="muted">' + esc(x.scanned) + '期</div></td><td>' + fmt(x.breaking) + '</td><td>' + fmtN(x.near) + '</td><td class="muted">' +
        (x.top || []).map(i => esc(i.label) + ' ' + i.cur).join(' · ') + '</td></tr>';
    }
    const e1 = document.getElementById('drec');
    if (e1) e1.innerHTML = t + '</table><div class="muted">' + esc(r.note || '') + '</div>';
  }).catch(e => { const x = document.getElementById('drec'); if (x) errBox(e, x); });
  // ②③ 复盘：上期对账（最新 checked）+ 下期快照（最新 unchecked），一次 /api/review 拿全
  api('/api/review').then(r => {
    const rows = r.rows || [], summary = r.summary || {};
    const checkedRow = rows.find(x => x.checked && x.hit);
    const snapRow = rows.find(x => !x.checked);
    const e2 = document.getElementById('drev');
    if (e2) {
      if (checkedRow) {
        const s = summary[checkedRow.kind];
        e2.innerHTML = '<div class="kv"><span>' + esc(LOT[checkedRow.kind] ? LOT[checkedRow.kind].name : checkedRow.kind) + ' 期 ' + esc(checkedRow.code) + '</span><span>开奖 ' + esc(checkedRow.hit.actual) + '</span></div>' +
          '<div class="kv"><span>各策略命中</span><span>' + esc((checkedRow.hit.picks || []).map(p => p.name + ' ' + p.hit).join(' / ')) + '</span></div>' +
          '<div class="kv"><span>胆 ' + esc(checkedRow.hit.danHit || 0) + ' · 杀错 ' + esc((checkedRow.hit.killWrong || []).join(' ') || '无') + '</span><span class="muted">滚动 ' + (s ? s.checked + ' 期' : '') + '</span></div>';
      } else e2.innerHTML = '<div class="muted">暂无已对账快照：每日同步后逐期累积。</div>';
    }
    const e3 = document.getElementById('dsnap');
    if (e3) {
      if (snapRow) {
        const p = snapRow.payload || {};
        e3.innerHTML = '<div class="kv"><span>' + esc(LOT[snapRow.kind] ? LOT[snapRow.kind].name : snapRow.kind) + ' 期 ' + esc(snapRow.code) + '（基于 ' + esc(p.basedOn || '') + '）</span><span></span></div>' +
          '<div class="kv"><span>推荐</span><span>' + esc((p.picks || []).map(x => x.name + ' ' + (x.main || []).join(' ')).join(' / ') || '—') + '</span></div>' +
          '<div class="kv"><span>胆</span><span>' + esc((p.dan || []).join(' ') || '—') + '</span></div>' +
          '<div class="kv"><span>杀</span><span>' + esc((p.kill || []).join(' ') || '—') + '</span></div>';
      } else e3.innerHTML = '<div class="muted">暂无待开奖快照：同步任务运行后自动生成。</div>';
    }
  }).catch(e => { const x2 = document.getElementById('drev'); if (x2) errBox(e, x2); const x3 = document.getElementById('dsnap'); if (x3) x3.innerHTML = '<span class="muted">复盘数据不可用</span>'; });
}

// 8 个彩种共用一套展示：后端 /api/{kind}/predict 返回统一结构 {picks:[{name,main,aux|digits,score}],kill,dan}
async function loadPredict(id){
  const [latest, rec] = await Promise.all([
    api('/api/' + id + '/latest'),
    api('/api/' + id + '/predict?win=30')
  ]);
  const isDigit = Array.isArray(latest.digits);
  let html = '<h3 style="margin:0 0 8px">' + esc(latest.code || '') + ' 期</h3>' + renderNums(latest);
  html += '<div class="muted">' + esc(latest.date || '') + ' · 源 ' + esc(((latest.sources || [latest.src]).join(',') || '-')) + '</div>';
  html += '<h4 style="margin:14px 0 6px">6 组参考（含结构分）</h4>';
  (rec.picks || []).forEach((p, i) => {
    html += '<div class="kv"><span>' + esc(p.name) + ' <span class="muted">分 ' + esc(p.score) + '</span></span><span>' +
      (isDigit ? balls(p.digits) : balls(p.main) + balls(p.aux, 'b')) + '</span></div>';
    if (!isDigit && asArr(p.main).length) html += '<div id="cold-p' + i + '" class="muted">冷门度加载中…</div>';
  });
  if (!isDigit) html += '<div class="muted">冷门度衡量的是"万一中了能独享多少"（选号撞车度），<b>不改变中奖概率</b>，期望回报仍为负。</div>';
  html += '<p class="muted">' + esc(rec.disclaimer || '') + '</p>';
  const dl = rec.dan || {};
  let kl = rec.kill || {}, killTag = '', killCalNote = '';
  try {
    const ck = await api('/api/kill-calibrated?kind=' + id);
    if (ck.main && ck.main.length) {
      kl = ck; killTag = '（回测校准权重 · 展示参考）';
      killCalNote = '<div class="muted">以上仅为按回测校准权重排序的<b>展示参考</b>列表；生成上方推荐号与胆拖投注单时不使用这些权重（后端用未加权票数）。校准不改变中奖概率。</div>';
    }
  } catch (e2) { /* 校准失败退回普通杀号 */ }
  if (kl.main && kl.main.length) {
    html += '<h4 style="margin:14px 0 6px">杀号' + killTag + '</h4><div class="muted">' +
      kl.main.slice(0, 12).map(x => esc(x.n) + '(' + esc(x.votes) + ')').join(' ') + '</div>' + killCalNote;
  } else if (kl.perPos) {
    html += '<h4 style="margin:14px 0 6px">分位杀号</h4><div class="muted">' +
      kl.perPos.map(pp => '第' + pp.pos + '位 ' + pp.kill.slice(0, 3).map(x => esc(x.n)).join(',')).join('　') + '</div>';
  }
  if (dl.main && dl.main.length) {
    html += '<h4 style="margin:14px 0 6px">胆码</h4><div>' + balls(dl.main.slice(0, 5).map(x => x.n)) +

  } else if (dl.perPos) {
    html += '<h4 style="margin:14px 0 6px">分位胆码</h4><div class="muted">' +
      dl.perPos.map(pp => '第' + pp.pos + '位 ' + pp.dan.slice(0, 3).map(x => esc(x.n)).join(',')).join('　') + '</div>';
  }

    '<input id="tkd" placeholder="胆数" style="width:70px" value="2">' +
    '<input id="tkt" placeholder="拖数" style="width:70px" value="6">' +
    '<button id="tkgo">生成胆拖单</button></div><div id="tkout" class="muted"></div>';

  $('#p').innerHTML = html;
  // 冷门度逐组异步填充：后端接口未部署时各组自行显示"暂不可用"，不阻塞页面
  (rec.picks || []).forEach((p, i) => {

  });

        '<div id="tkcold" class="muted">本单冷门度（万一中了能独享多少，不改变中奖概率）加载中…</div>' +
        '<div class="muted">' + esc(r.note) + '</div>' +
        '<div class="row"><button id="tksave">保存到收藏</button><button id="tkcopy">复制文本</button><button id="tkdl">导出 TXT</button></div>';
      coldnessHtml(id, asArr(r.dan).concat(asArr(r.tuo)), r.aux).then(h => {
        const ce = document.getElementById('tkcold');
        if (ce) ce.innerHTML = '本单' + h + '<span class="muted">（衡量"万一中了能独享多少"，不改变中奖概率）</span>';
      });
      document.getElementById('tksave').onclick = async () => {
        try {
          await fetch(base() + '/api/favs', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, headers()),
            body: JSON.stringify({ kind: id, numbers: '胆 ' + r.dan.join(',') + ' 拖 ' + r.tuo.join(',') + (r.aux && r.aux.length ? ' 副 ' + r.aux.join(',') : ''), note: r.bets + '注/' + r.amount + '元' })
          });
          document.getElementById('tksave').textContent = '已保存 ✓';
        } catch (e) { errBox(e, out); }
      };
      document.getElementById('tkcopy').onclick = async () => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(txt);
          else throw new Error('浏览器不支持剪贴板，请用导出 TXT');
          document.getElementById('tkcopy').textContent = '已复制 ✓';
        } catch (e) { errBox(e, out); }
      };
      document.getElementById('tkdl').onclick = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
        a.download = r.name + '-胆拖单-' + new Date().toISOString().slice(0, 10) + '.txt';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      };
    } catch (e) { errBox(e, out); }
  };
  await loadAnalyze(id);
  await loadHistory(id);
}

// 胆拖单导出文本（保存到收藏 / 复制 / 下载共用）

  return '【' + r.name + ' 胆拖单】\n胆码: ' + r.dan.join(',') + '\n拖码: ' + r.tuo.join(',') +
    (r.aux && r.aux.length ? '\n副区: ' + r.aux.join(',') : '') +
    '\n注数: ' + r.bets + ' 注 / ' + r.amount + ' 元\n生成时间: ' + new Date().toLocaleString() +

// ---------- 冷门度：只回答"万一中了能独享多少"，不改变中奖概率 ----------
// 后端 /api/coldness 尚在并行开发：任一字段可能缺失，非 200/404 一律显示中性"暂不可用"，绝不抛错误块
async function coldnessHtml(kind, main, aux){
  const NA = '<span class="muted">冷门度：暂不可用</span>';
  const nums = asArr(main).join(',');
  if (!nums) return NA;
  let r;
  try {
    r = await api('/api/coldness?kind=' + kind + '&nums=' + encodeURIComponent(nums) + '&blue=' + encodeURIComponent(asArr(aux).join(',')));
  } catch (e) { return NA; }
  const bits = [];
  if (r && r.coldIndex != null) bits.push('冷门度 <b>' + esc(r.coldIndex) + '</b>/100（越高越冷）');
  if (r && r.ratio != null) bits.push('预计一等同奖 ' + esc(Number(r.ratio).toFixed(2)) + ' × 平均人数（<1 更可能独享）');
  if (r && (r.estWinners != null || r.avgFirstWinners != null)) bits.push('同奖约 ' + esc(r.estWinners != null ? r.estWinners : '-') + ' 人（平均 ' + esc(r.avgFirstWinners != null ? r.avgFirstWinners : '-') + '）');
  if (r && Array.isArray(r.factors) && r.factors.length) bits.push('因子：' + r.factors.map(f => esc(f.label) + ' ' + (Number(f.effect) > 0 ? '+' : '') + esc(f.effect)).join('、'));
  if (!bits.length) return NA;
  return '冷门度：' + bits.join('　') + (r.disclaimer ? '　' + esc(r.disclaimer) : '');
}

        '<br>平均和值 ' + esc(an.avgSum) + '　平均大数个数 ' + esc(an.avgBigSmall) +

    const om = an.omission || {};

    const auxTop = an.auxFreq && Object.keys(an.auxFreq).length

    $('#stats').innerHTML =
      '热号 ' + esc((an.hot || []).join(',')) + '　冷号 ' + esc((an.cold || []).join(',')) + '<br>' +
      '奇偶比 ' + esc(an.oddRatio) + '　大小比 ' + esc(an.bigRatio) + '　质合比 ' + esc(an.primeRatio) + '<br>' +
      '均和 ' + esc(an.avgSum) + '　平均AC ' + esc(an.avgAC) + '　平均连号 ' + esc(an.avgConsec) + '　平均重号 ' + esc(an.avgRepeat) + '<br>' +
      '012路 ' + esc((an.road012 || []).join('/')) + '　区间分布 ' + esc((an.zoneDist || []).join('/')) + '<br>' +
      '历史最大遗漏 ' + esc(maxOm) + ' 期' + (auxTop ? '<br>副区高频 ' + esc(auxTop) : '') +

        .map(([k, v]) => esc(k) + '(' + v + '期·均值' + esc(om.avg[k] != null ? om.avg[k] : '-') + ')').join(' ');
    await loadBacktest(id);
    // 形态转移卡片（号码池型）：上一期形态 → 下期最可能形态
    if (an.shape && an.shape.sum) {
      const dims = [["sum", "和值"], ["odd", "奇偶"], ["big", "大小"], ["r012", "012路"]];
      const shapeTxt = dims.map(([k, label]) => {

        return label + ' ' + esc(d.last) + '→' + (d.next || []).map(x => esc(x.shape) + '(' + Math.round(x.p * 100) + '%)').join('/');
      }).filter(Boolean).join('　');

    }
    // 号码池型才有遗漏走势（数字型无号码池）；insertAdjacentHTML 不破坏已绑定的按钮事件
    if (an.freq && Object.keys(an.freq).length) {
      $('#stats').insertAdjacentHTML('beforeend',
        '<div style="margin-top:10px;padding-top:8px;border-top:1px dashed #eee"><b>遗漏走势</b> <span class="muted">（各号码当期连续未出期数，回到 0 = 当期开出）</span>' +
        '<div class="row"><input id="trn" placeholder="号码，逗号分隔；留空取当前遗漏最深 4 个" style="flex:1;min-width:200px">' +

// 遗漏走势：统一引擎 /api/trend?kind=xx（trendPool），每条折线是一个号码的逐期遗漏

// 噪声对照图：真实频次 vs 随机 ±2σ 带 —— 教眼睛把"冷热"读成随机波动而不是规律。
// 基线由已取回的数据自推：池大小 = freq 键数，每期开出个数 k = Σfreq/count，期望 μ = count·k/pool，
// σ 用二项 × 一期内不放回修正 sqrt(count·p(1−p)·(pool−k)/(pool−1))，p = k/pool。
function drawNoiseChart(id, an){
  const ks = Object.keys(an.freq || {}).sort();
  const pool = ks.length;
  if (!pool || !an.count) return;
  const vals = ks.map(k => Number(an.freq[k]) || 0);
  const totalPicks = vals.reduce((a, b) => a + b, 0);
  const k = totalPicks / an.count;
  if (k <= 0 || k >= pool) return;
  const mu = totalPicks / pool;
  const p0 = k / pool;
  const sigma = Math.sqrt(Math.max(0, an.count * p0 * (1 - p0) * (pool - k) / Math.max(1, pool - 1)));
  const lo = mu - 2 * sigma, hi = mu + 2 * sigma;
  const out = ks.filter((kk, i) => vals[i] < lo || vals[i] > hi);
  $('#stats').insertAdjacentHTML('beforeend',
    '<div style="margin-top:10px;padding-top:8px;border-top:1px dashed #eee"><b>这就是随机该有的样子</b>' +
    ' <span class="muted">（近 ' + esc(an.count) + ' 期频次对照随机 ±2σ 带：带内波动＝噪声，不是规律）</span>' +
    '<div id="chart3" style="height:260px"></div>' +
    '<div id="noiseout" class="muted">随机带 ' + mu.toFixed(1) + ' ± ' + (2 * sigma).toFixed(1) + ' 次；' +
    '落在带外的号码 ' + out.length + ' 个' + (out.length ? '（' + out.map(esc).join('、') + '）' : '（无）') +
    '——' + pool + ' 个号码纯随机本来就该有约 1-2 个越界，越界≠冷热有信息。</div></div>');
  const el = document.getElementById('chart3');
  if (typeof echarts === 'undefined') { el.innerHTML = '<div class="muted">图表库未加载（离线或 CDN 被拦截），上方带外计数仍可读。</div>'; return; }
  if (!window.__chart3) window.__chart3 = echarts.init(el);
  window.__chart3.setOption({
    grid: { left: 40, right: 12, top: 14, bottom: 30 },
    xAxis: { type: 'category', data: ks, axisLabel: { fontSize: 10 } },
    yAxis: { type: 'value' },
    series: [{
      type: 'bar',
      data: vals.map(v => ({ value: v, itemStyle: { color: (v < lo || v > hi) ? '#e11' : '#bbb' } })),
      markLine: { silent: true, symbol: 'none', lineStyle: { type: 'dashed', color: '#888' }, data: [{ yAxis: +mu.toFixed(2) }], label: { formatter: '期望 ' + mu.toFixed(1), fontSize: 10 } },
      markArea: { silent: true, itemStyle: { color: 'rgba(136,136,136,.12)' }, data: [[{ yAxis: +lo.toFixed(2) }, { yAxis: +hi.toFixed(2) }]] }
    }]
  }, true);
}

// p 值展示：p<0.05 视为显著偏离基线；null = 样本不足（不评估）
function pTag(p){
  if (p == null) return ' <span class="muted">（样本不足，不评估显著性）</span>';
  if (p < 0.05) return ' <b style="color:#0a7">p=' + p + ' 显著</b>';
  return ' <span class="muted">p=' + p + '</span>';
}
// 判定最低样本量：低于此值只报"样本不足，无法判断"，不给"有效/无信息/√/显著"结论
const MIN_BT_SAMPLE = 100;
function verdictTag(verdict, n, p){
  if (n == null || n < MIN_BT_SAMPLE) return ' <b>样本不足，无法判断</b>' + (n != null ? '<span class="muted">（样本 ' + esc(n) + '，低于 ' + MIN_BT_SAMPLE + '）</span>' : '');
  return ' <b>' + esc(verdict) + '</b>' + pTag(p);
}
// 回测摘要：策略/杀号历史表现 vs 随机基线（失败不影响主统计展示）
// periods 可传 ≤600：跨度 >60 期时后端自动抽样（免费版 CPU 限制），返回 tested/stride 供展示
async function loadBacktest(id, periods){
  try {
    const bt = await api('/api/backtest?kind=' + id + (periods ? '&periods=' + encodeURIComponent(periods) : ''));
    const spanTxt = bt.stride > 1
      ? '近 ' + esc(bt.periods) + ' 期跨度 · 抽样 ' + esc(bt.tested) + ' 点 · 步长 ' + esc(bt.stride)
      : '近 ' + esc(bt.periods) + ' 期';
    let extra = '';
    if (bt.strategies) {
      extra = '<b>回测</b>（' + spanTxt + ' · 单号基线 ' + (bt.baseline * 100).toFixed(1) + '%）：热号均中 ' +
        esc(bt.strategies.hot.avgHit) + ' / 冷号均中 ' + esc(bt.strategies.cold.avgHit) + ' / 胆码均中 ' +
        esc(bt.strategies.dan.avgHit) + '（胆基线 ' + esc(bt.strategies.dan.baseline) + '）<br>杀号命中率 ' +
        (bt.kill.hitRate * 100).toFixed(1) + '% vs 随机基线 ' + (bt.kill.baseline * 100).toFixed(1) + '% →' + verdictTag(bt.kill.verdict, bt.tested, bt.kill.p);
      if (bt.aux) extra += '　副区热号命中 ' + (bt.aux.hot.hitRate * 100).toFixed(1) + '%（基线 ' + (bt.aux.hot.baseline * 100).toFixed(1) + '%）';
      const fs = (bt.kill.formulas || []).filter(f => f.killed > 0);
      if (fs.length) extra += '<br><b>杀号公式校准</b>（√=低于基线且杀号样本 ≥' + MIN_BT_SAMPLE + '）：' +
        fs.map(f => esc(f.label) + ' ' + (f.rate * 100).toFixed(1) + '%（基线 ' + (f.baseline * 100).toFixed(1) + '%）' +
          (f.killed < MIN_BT_SAMPLE ? '<span class="muted">样本不足，无法判断</span>'
            : (f.verdict === '有效' ? '√' : '—') + (f.p != null && f.p < 0.05 ? '<b style="color:#0a7">·显著</b>' : ''))).join('　');
      extra += '<br><span class="muted">样本上限提示：本回测可用的最深历史约 650 期；检出单号 ±10% 级别的偏差约需 3500 期（见 docs/randomness-2026-09.md）。' +
        '所以"未发现信号"= 当前样本量下检不出来，不等于"已证明随机"。</span>';
      // 分年稳定性：单一学年没有对比意义，>1 个年代才展示
      if (bt.eras && bt.eras.length > 1) {
        extra += '<br><b>分年稳定性</b>：' + bt.eras.map(e => esc(e.era) + ' 热' + (e.hotRate * 100).toFixed(0) + '%' +
          (e.killRate != null ? '/杀' + (e.killRate * 100).toFixed(0) + '%' : '')).join(' · ');
      }
    } else if (bt.perPos) {
      const avgOf = key => bt.perPos.reduce((a, r) => a + (r[key] || 0), 0) / bt.perPos.length;
      const kr = bt.perPos.filter(r => r.killRate != null);
      extra = '<b>回测</b>（' + spanTxt + ' · 单位基线 10%）：各位热号均中率 ' + (avgOf('hotRate') * 100).toFixed(1) +
        '% / 冷号均中率 ' + (avgOf('coldRate') * 100).toFixed(1) + '%' +
        (kr.length ? ' / 首位杀号命中率 ' + ((kr.reduce((a, r) => a + r.killRate, 0) / kr.length) * 100).toFixed(1) + '%' : '');
    }
    if (bt.note) extra += '<br><span>' + esc(bt.note) + '</span>';
    if (bt.eras && bt.eras.length > 1) extra += '<div id="btchart" style="height:220px;margin-top:8px"></div>';
    extra += '<div class="row" style="margin-top:6px"><input id="btp" placeholder="回测期数（≤600，>60 自动抽样）" style="width:200px"><button id="btgo">按期数重算</button>' +
      '<button id="btho">校准外推检验</button><button id="btkt">杀号阈值寻优</button><span id="hoout" class="muted"></span><span id="ktout" class="muted"></span></div>';
    // insertAdjacentHTML + 先移除旧块：重算时不会丢失走势图的按钮事件
    const old = document.getElementById('btout');
    if (old) old.remove();
    $('#stats').insertAdjacentHTML('beforeend', '<div id="btout" style="margin-top:8px;padding-top:8px;border-top:1px dashed #eee" class="muted">' + extra + '</div>');
    // 分年柱图：热号/杀号命中率逐年对比 + 随机基线参考线（一眼看出策略是稳定还是靠某一年撑的）
    if (bt.eras && bt.eras.length > 1 && typeof echarts !== 'undefined') {
      const bcel = document.getElementById('btchart');
      if (bcel) {
        if (!window.__btchart) window.__btchart = echarts.init(bcel);
        window.__btchart.clear();
        window.__btchart.setOption({
          grid: { left: 44, right: 12, top: 30, bottom: 24 },
          legend: { top: 0, textStyle: { fontSize: 11 } },
          tooltip: { trigger: 'axis', valueFormatter: v => v == null ? '-' : (v * 100).toFixed(1) + '%' },
          xAxis: { type: 'category', data: bt.eras.map(e => e.era), axisLabel: { fontSize: 11 } },
          yAxis: { type: 'value', axisLabel: { fontSize: 10, formatter: v => (v * 100).toFixed(0) + '%' } },
          series: [
            { name: '热号命中率', type: 'bar', data: bt.eras.map(e => e.hotRate), itemStyle: { color: '#c0392b' } },
            { name: '杀号命中率', type: 'bar', data: bt.eras.map(e => e.killRate), itemStyle: { color: '#2980b9' } },
            { name: '随机基线', type: 'line', data: bt.eras.map(() => bt.baseline), lineStyle: { type: 'dashed', color: '#888' }, itemStyle: { color: '#888' }, symbol: 'none' }
          ]
        });
      }
    }
    const go = document.getElementById('btgo');
    if (go) go.onclick = () => { const v = parseInt(document.getElementById('btp').value, 10); if (v > 0) loadBacktest(id, Math.min(600, v)); };
    const ho = document.getElementById('btho');
    if (ho) ho.onclick = () => loadHoldout(id);
    const kt = document.getElementById('btkt');
    if (kt) kt.onclick = () => loadKillTune(id);
  } catch (e2) { /* 回测接口失败时保持主统计展示 */ }
}

// 杀号阈值寻优：默认「杀票数前 30%」对不对？5 个分位旧段拟合 → 新段验证，gap 小 = 阈值有信息量
async function loadKillTune(id){
  const el = document.getElementById('ktout');
  if (el) el.innerHTML = '阈值寻优计算中（10 次回测，全站最重端点，约几秒）…';
  try {
    const r = await api('/api/kill-tune?kind=' + id);
    if (r.note && !r.train) { if (el) el.innerHTML = esc(r.note); return; }
    const row = arr => arr.map(x => '<td>' + (x.frac * 100).toFixed(0) + '%<br><b>' + (x.hitRate * 100).toFixed(1) + '%</b></td>').join('');
    const atFrac = f => r.test.find(x => x.frac === f) || { hitRate: NaN };
    if (el) el.innerHTML = '<br><b>杀号阈值寻优</b>（旧 ' + esc(r.tested.train) + ' 期拟合 → 新 ' + esc(r.tested.test) + ' 期验证，杀号命中率越低越好）' +
      '<table><tr><th>分位</th>' + r.train.map(x => '<th>' + (x.frac * 100).toFixed(0) + '%</th>').join('') + '</tr>' +
      '<tr><td>train</td>' + row(r.train) + '</tr>' +
      '<tr><td>test</td>' + row(r.test) + '</tr></table>' +
      '<div>train 最优 ' + (r.trainBest.frac * 100).toFixed(0) + '% → test 上 ' + (atFrac(r.trainBest.frac).hitRate * 100).toFixed(1) + '%；test 事后最优 ' +
      (r.oracle.frac * 100).toFixed(0) + '% → ' + (r.oracle.hitRate * 100).toFixed(1) + '%，gap=' + r.gap.toFixed(4) + '</div>' +
      '<div><b>' + esc(r.verdict || '') + '</b></div>';
  } catch (e) { if (el) el.innerHTML = '<span class="err">阈值寻优失败：' + esc(e.message || e) + '</span>'; }
}

// 校准外推检验：权重只用旧段拟合，在新段对比「加权 vs 未加权」杀号命中率（防过拟合的直接证据）
async function loadHoldout(id){
  const el = document.getElementById('hoout');
  if (el) el.innerHTML = '外推检验计算中（拉全量历史 + 三次回测，约几秒）…';
  try {
    const r = await api('/api/kill-calibrated?kind=' + id + '&holdout=0.3');
    const h = r.holdout || {};
    if (!h.calibrated) { if (el) el.innerHTML = esc(h.note || '无外推检验结果'); return; }
    const c = h.calibrated, rw = h.raw;
    const cmp = c.hitRate < rw.hitRate ? '<b style="color:#0a7">校准在新段仍更准（外推有效）</b>'
      : c.hitRate > rw.hitRate ? '<b style="color:#c60">校准在新段反而更差（过拟合嫌疑）</b>' : '持平';
    if (el) el.innerHTML = '<br><b>外推检验</b>（旧 ' + esc(h.fitN) + ' 期拟合 → 新 ' + esc(h.evalN) + ' 期验证，抽样 ' + esc(h.tested) + ' 点）：加权杀号 ' +
      (c.hitRate * 100).toFixed(1) + '% vs 未加权 ' + (rw.hitRate * 100).toFixed(1) + '%（基线 ' + (c.baseline * 100).toFixed(1) + '%）→ ' + cmp;
  } catch (e) { if (el) el.innerHTML = '<span class="err">外推检验失败：' + esc(e.message || e) + '</span>'; }
}

// ---------- 工具：注数/金额/追号 与 中奖计算器 ----------
// 长期返奖率（期望回收 ÷ 投入），数值取自全量历史审计：docs/randomness-2026-09.md
const PAYOUT = { ssq: 0.51, dlt: 0.51, qlc: 0.51, kl8: 0.57, fc3d: 0.52, pl3: 0.52, pl5: 0.52, qxc: 0.52 };
const CALC_FIELDS = {
  ssq: [['red', '红球个数', 90], ['blue', '蓝球个数', 90], ['dan', '胆码数', 80], ['tuo', '拖码数', 80]],
  dlt: [['front', '前区个数', 90], ['back', '后区个数', 90], ['fdan', '前区胆', 80], ['ftuo', '前区拖', 80], ['bdan', '后区胆', 80], ['btuo', '后区拖', 80]],
  qlc: [['main', '基本号个数', 100], ['dan', '胆码数', 80], ['tuo', '拖码数', 80]],
  kl8: [['pick', '选几(1-10)', 90], ['nums', '选号个数', 90]]
};
const PRIZE_FIELDS = {
  kl8: [['pick', '选几', 80], ['hit', '命中个数', 90]],
  fc3d: [['bet', '你的号码(3位)', 160], ['draw', '开奖号(3位)', 160]],
  pl3: [['bet', '你的号码(3位)', 160], ['draw', '开奖号(3位)', 160]],
  ssq: [['hitMain', '命中红球', 90], ['hitAux', '中蓝球(1/0)', 100]],
  dlt: [['hitMain', '命中前区', 90], ['hitAux', '命中后区', 90]],

  $('#pgo').onclick = async () => {

          (s.danHitRate != null ? '<div>定胆命中率 ' + (s.danHitRate * 100).toFixed(1) + '%' + pTag(s.danP) + '</div>' : '') +
          (s.killWrongRate != null ? '<div>杀号杀错率 ' + (s.killWrongRate * 100).toFixed(1) + '%（越低越好，低于基线才有价值）' + pTag(s.killP) + '</div>' : '') +
          '<div id="revchart" style="height:200px;margin-top:8px"></div>' + '</div>'
        : '<div class="muted">暂无已对账记录：同步任务运行后逐期累积。</div>';
      const rows = (r.rows || []).filter(x => x.checked && x.hit).slice(0, 8);
      if (rows.length) {
        h += '<table><tr><th>期号</th><th>推荐（各策略主区）</th><th>开奖</th><th>命中</th></tr>' +
          rows.map(x => '<tr><td>' + esc(x.code) + '</td><td>' +
            esc((x.payload.picks || []).map(p => (p.main || []).join(' ')).join(' / ')) + '</td><td>' + esc(x.hit.actual) + '</td><td>' +
            esc((x.hit.picks || []).map(p => p.hit).join('/') + '，胆' + (x.hit.danHit || 0) + '，杀错' + (x.hit.killWrong || []).length) + '</td></tr>').join('') + '</table>';
      }
      $('#rout').innerHTML = h || '<div class="muted">暂无数据</div>';
      // 复盘小图：推荐命中 / 杀号错杀 各自对照随机基线（p<0.05 的项标题栏标绿）
      if (s && typeof echarts !== 'undefined') {
        const rc = document.getElementById('revchart');
        if (rc) {
          if (!window.__revchart) window.__revchart = echarts.init(rc);
          window.__revchart.clear();
          window.__revchart.setOption({
            grid: { left: 44, right: 12, top: 30, bottom: 24 },
            legend: { top: 0, textStyle: { fontSize: 11 } },
            tooltip: { trigger: 'axis', valueFormatter: v => v == null ? '-' : (v * 100).toFixed(1) + '%' },
            xAxis: { type: 'category', data: ['推荐命中', '杀号错杀'], axisLabel: { fontSize: 11 } },
            yAxis: { type: 'value', axisLabel: { fontSize: 10, formatter: v => (v * 100).toFixed(0) + '%' } },

// ---------- 验奖 + 矩阵 ----------
// 批量验奖的示例按彩种给：数字彩连写（922）与红蓝（+）格式不同，占位符统一会让用户照着错的格式贴
function vbExample(id){
  return {
    ssq: '01 05 12 22 28 30 + 04', dlt: '01 05 12 22 30 + 03 07', qlc: '01 05 12 18 22 26 30',
    kl8: '03 17 28 44 55（选几个写几个）', fc3d: '9 2 2，或连写 922', pl3: '9 2 2，或连写 922',
    pl5: '9 2 2 1 5', qxc: '3 7 1 4 9 0 12'
  }[id] || '每行一注';
}
// 后端各彩种的命中字段名不同（主/辅、选/中、按位），这里收敛成一行，避免结果表里为空
function hitText(r){
  const bits = [];
  if (r.hitMain !== undefined) bits.push('主 ' + r.hitMain);
  if (r.hitAux !== undefined) bits.push('辅 ' + r.hitAux);
  if (r.hitSpecial !== undefined) bits.push('特别号 ' + (r.hitSpecial ? '中' : '未中'));
  if (r.pick !== undefined) bits.push('选 ' + r.pick + ' 中 ' + r.hitNums);
  if (r.posHit !== undefined) bits.push('按位 ' + r.posHit + (r.total ? '/' + r.total : ''));
  return bits.join('　');
}
// 批量验奖结果渲染。两处刻意的口径：金额 null 显示「—（见公告）」而不是 0；净差只统计已给金额的奖级。
function renderVerifyBatch(r){
  let h = '';
  if (r.errors && r.errors.length) {
    h += '<div class="warn">' + r.errors.length + ' 行未通过校验（行号＝粘贴内容的第几行），其余票照常校验：<br>' +
      r.errors.map(e => '第 ' + esc(e.line) + ' 行「' + esc(e.ticket) + '」→ ' + esc(e.error)).join('<br>') + '</div>';
  }
  for (const rd of (r.rounds || [])) {
    h += '<div class="card"><div class="row"><b>' + esc(rd.code) + '</b>';
    if (!rd.drawn) { h += '<span class="muted">' + esc(rd.note || '未开奖') + '</span></div></div>'; continue; }
    const a = rd.actual || {};
    const pk = ['red', 'front', 'main', 'nums', 'digits'].filter(k => Array.isArray(a[k]))[0];
    h += (pk ? balls(a[pk]) : '') + (a.blue ? balls(a.blue, 'b') : '') +
      (Array.isArray(a.back) ? balls(a.back, 'b') : '') + (a.special ? balls(a.special, 'b') : '') + '</div>';
    const s = rd.summary || {};
    h += '<div class="muted">已解析 ' + esc(s.tickets) + ' 注 · 倍数 ×' + esc(s.multi) +
      ' · 中奖 ' + esc(s.winning) + ' 注 · 成本 ' + esc(s.cost) + ' 元（每注 2 元） · 已给金额奖金 ' + esc(s.amountKnown) +
      ' 元 · 净差 ' + esc(s.netIfKnown) + ' 元（只统计本站给出金额的奖级）</div>';
    if (s.amountUnknownTier) h += '<div class="warn">另有 ' + esc(s.amountUnknownTier) +
      ' 注中的是本站未给金额的奖级（浮动奖按当期公告与注数分配，或规则分时代），不要按 0 计算。</div>';
    const all = (rd.results || []).filter(x => !x.error);
    const wins = all.filter(x => x.grade !== '未中');
    const loss = all.length - wins.length;
    if (wins.length) {
      h += '<table><tr><th>号码</th><th>奖级</th><th>命中</th><th>金额</th></tr>' +
        wins.map(w => '<tr><td style="text-align:left">' + esc(w.ticket) + '</td><td>' + esc(w.grade) +
          '</td><td>' + esc(hitText(w)) + '</td><td>' + (w.amount == null ? '—（见公告）' : esc(w.amount) + ' 元') + '</td></tr>').join('') + '</table>';
      const notes = [];
      wins.forEach(w => { if (w.note && notes.indexOf(w.note) < 0) notes.push(w.note); });
      h += '<div class="muted">' + (loss ? '其余 ' + loss + ' 注未中。' : '') + esc(notes.join(' ')) + '</div>';
    } else {
      h += '<div class="muted">本期 ' + esc(loss) + ' 注全部未中。</div>';
    }
    h += '</div>';
  }
  if (r.amountUnverified && r.amountUnverified.length) h += '<div class="muted">该彩种固定奖金额本站未逐字段校验 → 只给奖级不给金额，理由见每期结果内的说明与 README。</div>';
  return h + '<div class="muted">' + esc(r.note || '') + '<br>' + esc(r.disclaimer || '') + '</div>';
}

  h += '<h3 style="margin:16px 0 8px">批量验奖（一沓票一次验完）</h3>' +
    '<div class="row"><input id="bcp" placeholder="期号，多个用逗号分隔；留空＝最近一期" style="flex:1;min-width:200px">' +

    '<div class="row"><button id="bgo">批量验奖</button><span class="muted">最多 200 注、10 期；坏行只报错不吞掉其余票</span></div><div id="bo"></div>';
  h += '<h3 style="margin:16px 0 8px">旋转矩阵（覆盖设计）</h3>' +
    '<div class="row"><input id="mn" placeholder="自选 n" style="width:100px" value="12">' +
    '<input id="mp" placeholder="每注 k" style="width:90px" value="6">' +
    '<input id="mh" placeholder="保中 t" style="width:80px" value="4">' +
    '<button id="mgo">生成</button></div><div id="mo" class="muted"></div>';
  $('#v').innerHTML = h;

  $('#vgo').onclick = async () => {
    const out = $('#vo');
    try {
      const code = $('#vc').value.trim();
      let path;
      if (l.mode === 'rb') {
        const r = $('#vr').value.trim(), b = $('#vb').value.trim();
        path = '/api/' + id + '/verify?code=' + encodeURIComponent(code) +
          '&' + (id === 'ssq' ? 'red=' : 'front=') + encodeURIComponent(r) +
          '&' + (id === 'ssq' ? 'blue=' : 'back=') + encodeURIComponent(b);
      } else {
        path = '/api/' + id + '/verify?code=' + encodeURIComponent(code) + '&nums=' + encodeURIComponent($('#vn').value.trim());
      }
      const res = await api(path);
      if (!res.hit) { out.innerHTML = '<div class="muted">' + esc(res.note || '未命中') + '</div>'; return; }
      const bits = [];
      if (res.hitRed !== undefined) bits.push('红球 ' + res.hitRed);
      if (res.hitBlue !== undefined) bits.push('蓝球 ' + (res.hitBlue ? '中' : '未中'));
      if (res.hitFront !== undefined) bits.push('前区 ' + res.hitFront);
      if (res.hitBack !== undefined) bits.push('后区 ' + res.hitBack);
      if (res.hitMain !== undefined) bits.push('基本号 ' + res.hitMain);
      if (res.hitSpecial !== undefined) bits.push('特别号 ' + (res.hitSpecial ? '中' : '未中'));
      if (res.hitNums !== undefined) bits.push('命中 ' + res.hitNums + ' 个');
      if (res.posHit !== undefined) bits.push('按位 ' + res.posHit + '/' + res.total);
      out.innerHTML = '<div class="card"><b>' + esc(res.prize || '已匹配') + '</b><div class="muted">' + esc(bits.join('　')) +
        (res.note ? '<br>' + esc(res.note) : '') + '</div></div>';
    } catch (e) { errBox(e, out); }
  };

  $('#bgo').onclick = async () => {
    const out = $('#bo');
    try {
      const lines = ($('#bvt').value || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (!lines.length) { out.innerHTML = '<div class="warn">先把票贴进来：每行一注。</div>'; return; }
      let codes = ($('#bcp').value || '').split(/[^0-9]+/).filter(Boolean);
      if (!codes.length) { const lt = await api('/api/' + id + '/latest'); codes = [String(lt.code)]; }
      const m = parseInt($('#bcm').value, 10);
      out.innerHTML = '<div class="muted">校验 ' + lines.length + ' 注 × ' + codes.length + ' 期…</div>';
      const r = await apiPost('/api/verify-batch', { kind: id, codes, tickets: lines, mult: m > 0 ? m : 1 });
      out.innerHTML = renderVerifyBatch(r);
    } catch (e) { errBox(e, out); }
  };

  $('#mgo').onclick = async () => {
    const out = $('#mo');
    try {
      const r = await api('/api/rotation?n=' + encodeURIComponent($('#mn').value.trim() || 12) +
        '&pick=' + encodeURIComponent($('#mp').value.trim() || 6) +
        '&hit=' + encodeURIComponent($('#mh').value.trim() || 4));
      if (r.error) { out.innerHTML = '<div class="err">' + esc(r.error) + '</div>'; return; }
      out.innerHTML = '<div><b>' + esc(r.blocks) + ' 注</b> · ' + esc(r.note) + '</div>' +
        r.combos.map((c, i) => '<div class="kv"><span>第 ' + (i + 1) + ' 注</span><span>' + balls(c) + '</span></div>').join('');
    } catch (e) { errBox(e, out); }
  };
}

// ---------- 收藏 ----------
async function loadFavs(){
  const el = $('#f');
  el.innerHTML = '<h3 style="margin:0 0 8px">收藏</h3>' +
    '<div class="row"><input id="fn" placeholder="号码，逗号分隔" style="flex:1;min-width:200px">' +
    '<input id="fno" placeholder="备注" style="width:140px">' +
    '<button id="fadd">添加</button></div><div id="flist" class="muted">加载中…</div>';
  $('#fadd').onclick = async () => {
    try {
      await fetch(base() + '/api/favs', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, headers()),
        body: JSON.stringify({ kind: sel.value, numbers: $('#fn').value.trim(), note: $('#fno').value.trim() })
      });
      $('#fn').value = ''; $('#fno').value = '';
      loadFavs();
    } catch (e) { errBox(e, $('#flist')); }
  };
  try {
    const list = await api('/api/favs');
    $('#flist').innerHTML = list.length
      ? list.map(x => '<div class="kv"><span>' + esc(x.kind) + ' · ' + esc(x.numbers) +
          (x.note ? ' <span class="muted">' + esc(x.note) + '</span>' : '') + '</span>' +
          '<button data-id="' + esc(x.id) + '" class="fdel">删除</button></div>').join('')
      : '<div class="muted">暂无收藏（需在 Worker 配置 D1 与 API_TOKEN）</div>';
    document.querySelectorAll('.fdel').forEach(b => b.onclick = async () => {
      await fetch(base() + '/api/favs?id=' + b.dataset.id, { method: 'DELETE', headers: headers() });
      loadFavs();
    });
  } catch (e) { errBox(e, $('#flist')); }
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
if ($('#api').value) load();
</script>
