# 自建模板：复制为 wrangler.local.toml 后填写自己的值
# 注意 wrangler.local.toml 已在 .gitignore 中，不会被提交
name = "lottery-web"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# 自定义域名：把下面两处替换成你自己的域名与 zone；不需要就整段删掉
routes = [
  { pattern = "cp.example.com/*", zone_name = "example.com" }
]

[vars]
VERSION = "0.7.0"

# D1：先执行 npx wrangler d1 create lottery，把返回的 database_id 填到这里
[[d1_databases]]
binding = "DB"
database_name = "lottery"
database_id = "REPLACE_ME"

# 可选鉴权（不设置则接口完全公开）
# npx wrangler secret put API_TOKEN

# 定时落库走 GitHub Actions，见 .github/workflows/sync.yml
