name = "lottery-web"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# 自用域名：cp.leilaomi.cc.cd，需该zone已接CF
routes = [
  { pattern = "cp.leilaomi.cc.cd/*", zone_name = "leilaomi.cc.cd" }
]

[vars]
VERSION = "0.4.0"

# D1持久：lottery APAC
[[d1_databases]]
binding = "DB"
database_name = "lottery"
database_id = "REPLACE_ME"

# Cron免费账号已满5个，改走GitHub Actions兜底（.github/workflows/sync.yml）
