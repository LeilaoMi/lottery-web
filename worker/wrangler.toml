name = "lottery-web"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# 自定义域名（可选，默认注释）。
# 为什么默认注释：routes 是**同步语义** —— `wrangler deploy` 会把配置里没有的 route 从 Worker 上解绑。
# 模板里带着别人不持有的 zone，fork 的人直接部署就会失败；换成中性示例更诚实。
# 要启用：取消注释，改成自己的域名（该域名需已作为 zone 接入你的 Cloudflare 账号）。
#
# 注意：自己的部署用的是 gitignore 的 `wrangler.local.toml`，那份里**可以保留** route，
# 所以「模板不含 route」不会让已经绑好的自定义域名掉绑定 —— 两份文件、两种意图。
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" }
# ]

[vars]
VERSION = "0.13.1"

# D1 持久化：数据库 lottery（APAC）
# 注意：database_id 已脱敏，不进仓库。
# 自建时复制为 wrangler.local.toml 并填入自己的 ID。部署在 worker/ 目录内执行（--config 是相对这里的路径）：
#   cd worker && npm run build:ui && npx --yes wrangler deploy --config wrangler.local.toml
[[d1_databases]]
binding = "DB"
database_name = "lottery"
database_id = "REPLACE_ME"

# Cron：免费账号 5 个配额已满，改用 GitHub Actions 定时触发落库
# 见 .github/workflows/sync.yml（需配 secrets.WORKER_URL 与 secrets.API_TOKEN）
# [triggers]
# crons = ["30 13 * * 2", "30 13 * * 4", "30 13 * * 7"]
